<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueline for Stoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
/* VOICE   a quiet, technical work tool, like the layers panel beside a CAD viewport
   IDEA    a building is a stack of floor sheets: the left panel IS the stack, the viewport shows one sheet (Plan) or the whole stack (3D)
   PICTURE the viewport: dark sheet, blue trace of what was read, numbered proof marks; in 3D, plates stacked with walls rising
   COLOUR  greys #1C1C1C to #303030, ink #E4E4E4, Blueline blue #5B95FF, orange #E8A33D only for warnings
   LAYOUT  header; floors | viewport | ask; status bar. Narrow screens stack them. Blueline V5, 14 Nov 2026 */
:root{color-scheme:dark;--app:#1C1C1C;--pan:#232323;--hdr:#262626;--card:#2A2A2A;--card2:#303030;--fld:#1F1F1F;--vp:#2D2D2D;--bd:#151515;--bd2:#3A3A3A;--ink:#E4E4E4;--mut:#9A9A9A;--fnt:#6E6E6E;--blue:#5B95FF;--blue2:#8DB6FF;--bdg:#3A74E8;--bsel:#2B4677;--org:#E8A33D;--ok:#7CC48A;--red:#E06C6C}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.ic{width:16px;height:16px;flex:none;display:block}
body.dragui,body.dragui *{cursor:grabbing!important;user-select:none!important}
.app{display:grid;grid-template-rows:46px minmax(0,1fr) 26px;height:100%}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--hdr);border-bottom:1px solid var(--bd)}
.logo{position:relative;font:800 15px/1 Inter,sans-serif;letter-spacing:-.03em;color:#F2F2F2;flex:none}
.logo i{position:absolute;left:-3px;right:-3px;top:52%;height:1.5px;background:var(--blue);transform-origin:left;animation:slice .8s cubic-bezier(.65,0,.35,1) .15s both}
@keyframes slice{from{transform:scaleX(0)}}
.sep{width:1px;height:16px;background:var(--bd2);flex:none}
.pname{background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;width:200px;font-weight:500}
.pname:hover{border-color:var(--bd2)}.pname:focus{border-color:var(--blue);outline:none;background:var(--fld)}
.sp{flex:1}
.vseg{display:flex;background:#1B1B1B;border:1px solid var(--bd2);border-radius:9px;padding:2px;gap:2px;flex:none}
.vseg button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;border-radius:7px;padding:5px 16px;color:var(--mut);font-weight:500}
.vseg button:hover{color:var(--ink)}
.vseg button.on{background:var(--bsel);color:#fff}
.vseg button.busy{opacity:.6;cursor:progress}
.hb{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:0;border-radius:7px;background:#363636;white-space:nowrap;flex:none}
.hb:hover{background:#444}
.hb.pri{background:var(--bdg);color:#fff}.hb.pri:hover{background:#4A82F0}
.hb.icon{width:30px;padding:0;justify-content:center}

/* body grid */
.body{display:grid;grid-template-columns:272px minmax(0,1fr) 352px;gap:1px;background:var(--bd);min-height:0}
.mid{display:flex;flex-direction:column;gap:1px;min-height:0;min-width:0;background:var(--bd)}
.mid>.vw{flex:1}
/* trace panel: how an answer or a reading was worked out, step by step */
.trace{position:relative;height:var(--trh,270px);min-height:110px;background:var(--pan);display:flex;flex-direction:column}
.tgrip{position:absolute;left:0;right:0;top:-5px;height:10px;cursor:ns-resize;z-index:5}
.trh{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;border-bottom:1px solid var(--bd)}
.trh b{font-size:12.5px;white-space:nowrap}
.ttabs{display:flex;gap:2px;background:#1B1B1B;border:1px solid var(--bd2);border-radius:8px;padding:2px}
.ttabs button{border:0;background:none;border-radius:6px;padding:3px 11px;font-size:12px;color:var(--mut);white-space:nowrap}
.ttabs button.on{background:#3A3A3A;color:#fff}
.trb{flex:1;overflow:auto;padding:8px 16px 16px;font-size:13.5px}
.tq{color:#E0E0E0;margin:6px 0 6px;font-weight:500}
.tgh{display:flex;align-items:center;gap:8px;color:#E0E0E0;font-weight:600;margin:12px 0 2px}
.tgh:first-child{margin-top:6px}
.tgh .asc{font-weight:400}
.ts{display:grid;grid-template-columns:12px 190px minmax(0,1fr) 70px;gap:12px;align-items:start;padding:7px 0;border-bottom:1px solid #2B2B2B}
.ts code{font:500 12.5px/1.5 'JetBrains Mono',monospace;color:var(--blue2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts .td{color:#D2D2D2;line-height:1.5;font-size:13.5px;word-break:break-word}
.ts .tm{font:12px/1.6 'JetBrains Mono',monospace;color:var(--fnt);text-align:right;white-space:nowrap}
.tdot{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--ok)}
.ts.run .tdot{background:var(--blue);animation:pulse 1s infinite}
.ts.err .tdot{background:var(--red)}.ts.warn .tdot{background:var(--org)}
.raw{margin:5px 0 0;font:11px/1.45 'JetBrains Mono',monospace;color:#8FA3C4;background:#1D1D1D;border-radius:6px;padding:5px 8px;white-space:pre-wrap;word-break:break-all}
.tempty{color:var(--mut);padding:10px 0;max-width:640px;line-height:1.55}
.hb .live{width:7px;height:7px;border-radius:50%;background:var(--blue2);animation:pulse 1s infinite}
.hb.on{background:var(--bsel);color:#fff}
table.kt{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.kt th,.kt td{text-align:left;padding:5px 8px;border-bottom:1px solid #2B2B2B;vertical-align:top}
.kt th{color:var(--mut);font-weight:500}
.kt td.n{font-family:'JetBrains Mono',monospace;white-space:nowrap}
.kt tr.rw{cursor:pointer}.kt tr.rw:hover td{background:#2A2A2A}
.kt .ok{color:var(--ok)}.kt .no{color:var(--red)}.kt .ab{color:var(--org)}
.kscore{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px;color:#CFCFCF}
.kscore b{font:500 18px 'JetBrains Mono',monospace;color:var(--blue2)}
.rl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:11px;color:#EDEDED;background:rgba(18,18,18,.6);padding:1px 6px;border-radius:5px;white-space:nowrap;pointer-events:none}
.rl i{font-style:normal;color:#AFC6EE;font-family:'JetBrains Mono',monospace}
.gantt{display:flex;flex-direction:column;gap:2px;margin:4px 0 8px}
.grow{display:grid;grid-template-columns:150px minmax(0,1fr) 62px;gap:10px;align-items:center;border:0;background:none;padding:3px 4px;border-radius:6px;color:#CFCFCF;text-align:left;font-size:12px}
.grow:hover{background:#2A2A2A}.grow.on{background:#26324A}
.gn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{position:relative;height:10px;background:#1C1C1C;border-radius:5px;overflow:hidden}
.gt i{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--ok);min-width:3px}
.gt i.reading{background:var(--blue);animation:pulse 1s infinite}.gt i.error,.gt i.nokey{background:var(--red)}.gt i.queued,.gt i.idle{background:#555}
.gv{font:12px 'JetBrains Mono',monospace;color:var(--fnt);text-align:right}
.tsum{color:var(--mut);margin:6px 0 4px;line-height:1.5}
.tsum b{color:#E6E6E6;font-weight:600}
.ttabs .tl{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue2);margin-left:6px;vertical-align:middle;animation:pulse 1s infinite}
.mbox code{font:11.5px 'JetBrains Mono',monospace;background:#1E1E1E;border-radius:4px;padding:0 4px;color:#CFE0FF}

/* left: buildings + floors */
.left{background:var(--pan);display:flex;flex-direction:column;min-height:0}
.btabs{display:flex;gap:5px;padding:10px 10px 2px;flex-wrap:wrap}
.btab{position:relative;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 5px;border:1px solid var(--bd2);border-radius:8px;background:#272727;color:#CFCFCF;max-width:100%}
.btab:hover{border-color:#555}
.btab.on{background:#253148;border-color:#4A6FB0;color:#fff}
.btab.drop{outline:2px dashed var(--blue);outline-offset:1px}
.btab .bk{width:18px;height:18px;border-radius:5px;background:#3A3A3A;display:grid;place-items:center;font:700 11px Inter;flex:none}
.btab.on .bk{background:var(--bdg)}
.btab .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.btab .bc{font:11px 'JetBrains Mono',monospace;color:var(--mut)}
.btab .bx{display:none;width:16px;height:16px;border-radius:4px;place-items:center;color:var(--mut)}
.btab:hover .bx{display:grid}.btab .bx:hover{background:#444;color:#fff}
.btab.add{padding:0 9px;color:var(--mut);border-style:dashed}
.btab input{width:110px;background:var(--fld);border:1px solid var(--blue);border-radius:4px;padding:1px 4px}
.fhead{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fnt)}
.fhead .tip{text-transform:none;letter-spacing:0;font-size:11.5px}
.flist{flex:1;overflow:auto;padding:2px 10px 6px;position:relative}
.fc{position:relative;display:grid;grid-template-columns:14px 60px minmax(0,1fr) auto;align-items:center;gap:9px;height:66px;padding:6px 8px 6px 5px;margin-bottom:6px;border:1px solid var(--bd2);background:var(--card);border-radius:10px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.fc:hover{border-color:#4E4E4E}
.fc.on{border-color:#4A6FB0;background:#243047}
.fc.drag{z-index:5;box-shadow:0 12px 28px rgba(0,0,0,.6);border-color:var(--blue);pointer-events:none}
.fc.shift{transition:transform .16s ease}
.grip{color:#5E5E5E;display:grid;place-items:center;height:100%;cursor:grab;touch-action:none}
.fc:hover .grip{color:#9A9A9A}
.fth{position:relative;width:60px;height:46px;border-radius:6px;background:#1E1E1E;overflow:hidden;border:1px solid #333}
.fth img{width:100%;height:100%;object-fit:cover;filter:invert(.9) brightness(.9)}
.fth svg{width:100%;height:100%;display:block}
.flv{position:absolute;left:3px;bottom:2px;font:600 10px/1 'JetBrains Mono',monospace;background:rgba(20,20,20,.85);color:#DDD;border-radius:3px;padding:2px 4px}
.fmain{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.fnm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnm input{width:100%;background:var(--fld);border:1px solid var(--blue);border-radius:4px;padding:1px 5px;font-weight:600}
.fsub{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsub .er{color:#E89A9A}.fsub .wr{color:var(--org)}.fsub .rd{color:var(--blue2)}
.fside{display:flex;align-items:center;gap:4px}
.fbadge{font:600 11.5px 'JetBrains Mono',monospace;background:var(--bdg);color:#fff;border-radius:10px;padding:1px 7px}
.fact{display:none;gap:1px}
.fc:hover .fact,.fc:focus-within .fact{display:flex}
.fc:hover .fbadge,.fc:focus-within .fbadge{display:none}
@media (hover:none){.fc.on .fact{display:flex}.fc.on .fbadge{display:none}}
.ib{width:24px;height:24px;border:0;border-radius:6px;background:none;color:#A8A8A8;display:grid;place-items:center}
.ib:hover{background:#3C3C3C;color:#fff}
.fprog{position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:1px;overflow:hidden;background:#343434}
.fprog i{display:block;height:100%;width:35%;background:var(--blue);animation:slide 1.3s infinite ease-in-out}
.fprog.queued i{background:#666;animation-duration:2.4s}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
.fempty{border:1px dashed #444;border-radius:10px;padding:18px 12px;text-align:center;color:var(--mut);cursor:pointer}
.fempty:hover{border-color:var(--blue);color:var(--ink)}
.insl{position:absolute;left:10px;right:10px;height:3px;margin-top:-4px;background:var(--blue);border-radius:2px;pointer-events:none;box-shadow:0 0 0 3px rgba(91,149,255,.2)}
.fadd{margin:4px 10px 12px;border:1px dashed #484848;border-radius:10px;padding:10px;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:8px}
.fadd:hover{border-color:var(--blue);color:var(--ink);background:rgba(43,70,119,.2)}

/* viewport */
.vw{position:relative;background:var(--vp);overflow:hidden;min-height:0}
#psvg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#psvg.drag{cursor:grabbing}
#ptrace,#plive,#pev,#scan{pointer-events:none}
#c3{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none}
.vw.m3 #c3{display:block}
.vw.m3 #psvg,.vw.m3 .p-only{display:none!important}
.vw:not(.m3) .d-only{display:none!important}
.vw.isempty .p-only,.vw.isempty .d-only{display:none!important}
.vw.dropping::after{content:'Drop to add floors';position:absolute;inset:10px;border:2px dashed var(--blue);border-radius:12px;background:rgba(43,70,119,.25);display:grid;place-items:center;font-size:16px;color:#fff;z-index:9;pointer-events:none}
.ovl{position:absolute;z-index:3}
.flab{left:12px;top:12px;display:flex;align-items:center;gap:4px;background:rgba(32,32,32,.94);border:1px solid var(--bd2);border-radius:10px;padding:4px}
.flab .ft{padding:0 8px;line-height:1.3}
.flab .ft b{display:block;font-size:13px}
.flab .ft span{font-size:11.5px;color:var(--mut)}
.nb{width:30px;height:30px;border:0;border-radius:8px;background:none;color:#D0D0D0;display:grid;place-items:center}
.nb:hover{background:#404040}
.nb:disabled{opacity:.3;cursor:default}
.vnav{right:12px;top:12px;display:flex;flex-direction:column;gap:2px;background:rgba(32,32,32,.94);border:1px solid var(--bd2);border-radius:10px;padding:3px}
.nb.on{color:var(--blue2)}
.legend{left:12px;bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(32,32,32,.94);border:1px solid var(--bd2);border-radius:10px;padding:7px 11px;font-size:12px;color:#C8C8C8;max-width:calc(100% - 300px)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .lr{border:1.5px solid var(--blue);background:rgba(91,149,255,.15)}
.legend .li{border:1.5px solid #9BB8E8}
.legend .cn b{font:500 20px/1 'JetBrains Mono',monospace;color:var(--blue2);margin-right:6px;vertical-align:-2px}
.legend button{border:0;background:none;color:var(--blue2);padding:0}
.insp{right:12px;bottom:12px;width:250px;background:rgba(34,34,34,.97);border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;font-size:12.5px}
.insp h4{margin:0 0 4px;font-size:13.5px;padding-right:20px}
.insp .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;color:#CFCFCF}
.insp .row b{font-family:'JetBrains Mono',monospace;font-weight:500}
.insp .x{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--mut);padding:2px}
.rdban{left:50%;transform:translateX(-50%);top:62px;max-width:min(580px,calc(100% - 24px));background:rgba(34,34,34,.97);border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#DDD}
.rdban.warn{border-color:var(--org)}
.rdban span{flex:1 1 240px}
.rdban .spin{width:14px;height:14px;border:2px solid #555;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.kin{height:30px;flex:1 1 180px;border:1px solid var(--bd2);border-radius:6px;background:var(--fld);padding:0 9px}
#scan{stroke:var(--blue);stroke-width:2;vector-effect:non-scaling-stroke}
.empty{inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.dz{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:460px;padding:30px 34px;border:1px dashed #4C4C4C;border-radius:14px;background:rgba(32,32,32,.6)}
.dz svg.ill{width:200px;height:auto;margin-bottom:4px}
.dz h2{margin:0;font-size:18px;letter-spacing:-.01em}
.dz p{margin:0;color:var(--mut)}
.dz .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.dz small{color:var(--fnt);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;border:0;border-radius:7px;background:#3A3A3A;white-space:nowrap}
.btn:hover{background:#474747}
.btn.pri{background:var(--bdg);color:#fff}.btn.pri:hover{background:#4A82F0}
.btn.sm{height:28px;padding:0 11px;font-size:12.5px}
/* 3D overlay */
.lbl3{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.l3{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--bd2);background:rgba(30,30,30,.9);color:#D6D6D6;border-radius:8px;padding:3px 8px;font-size:12px;white-space:nowrap}
.l3:hover{border-color:#666}
.l3.on{border-color:#4A6FB0;background:rgba(43,70,119,.95);color:#fff}
.l3.hv{border-color:var(--blue2)}
.l3 b{font:600 11.5px 'JetBrains Mono',monospace;background:var(--bdg);color:#fff;border-radius:9px;padding:0 6px}
.l3 .st{width:6px;height:6px;border-radius:50%;background:#666}
.l3 .st.read{background:var(--ok)}.l3 .st.reading{background:var(--blue);animation:pulse 1s infinite}.l3 .st.error,.l3 .st.nokey{background:var(--org)}
@keyframes pulse{50%{opacity:.3}}
.ctl3{right:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:rgba(32,32,32,.94);border:1px solid var(--bd2);border-radius:10px;padding:6px 8px 6px 12px;font-size:12px;color:#C8C8C8;flex-wrap:wrap}
.ctl3 input[type=range]{width:110px;accent-color:var(--blue)}
.tg{height:26px;border:1px solid var(--bd2);border-radius:6px;background:#2C2C2C;padding:0 9px;font-size:12px}
.tg:hover{border-color:#5A5A5A}
.tg.on{background:var(--bsel);border-color:#4A6FB0;color:#fff}
.hint3{left:12px;top:12px;font-size:12px;color:#BDBDBD;background:rgba(32,32,32,.94);border:1px solid var(--bd2);border-radius:10px;padding:7px 11px;max-width:calc(100% - 380px)}
.hint3:empty{display:none}
.hint3 b{color:var(--blue2);font-weight:500}
/* plan drawing classes */
.pg{fill:#262626}.pgb{fill:none;stroke:#444;stroke-width:1}
.we{fill:none;stroke:#D2D2D2;stroke-width:6}.wi{fill:none;stroke:#C9C9C9;stroke-width:2.6}.wgap{fill:#262626}
.dl{stroke:#B5B5B5;stroke-width:1.2;fill:none}.da{stroke:#7A7A7A;stroke-width:.8;fill:none;stroke-dasharray:3 3}
.wl{stroke:#BFBFBF;stroke-width:1;fill:none}.fx{fill:none;stroke:#A8A8A8;stroke-width:1}
.rn{fill:#BDBDBD;font:700 11px Arial,sans-serif;text-anchor:middle;letter-spacing:.04em}.ra{fill:#8C8C8C;font:10px Arial,sans-serif;text-anchor:middle}.ru{fill:#7FA0D8;font:600 10px Arial,sans-serif;text-anchor:middle}
.dim{stroke:#666;stroke-width:.8}.dt{fill:#8A8A8A;font:10px Arial,sans-serif;text-anchor:middle}.tt{fill:#C8C8C8;font:700 15px Arial,sans-serif}.ts{fill:#8C8C8C;font:10px Arial,sans-serif}
.gw{stroke:#D2D2D2;stroke-width:2;fill:none}.gr{fill:rgba(255,255,255,.03);stroke:#BDBDBD;stroke-width:1.2}.gi{fill:none;stroke:#9A9A9A;stroke-width:1.2}
.tro{fill:rgba(91,149,255,.06);stroke:var(--blue);stroke-width:1.6;vector-effect:non-scaling-stroke}
.tri{fill:none;stroke:#9BB8E8;stroke-width:1.2;vector-effect:non-scaling-stroke}

.evb{fill:rgba(91,149,255,.14);stroke:var(--blue);stroke-width:2;vector-effect:non-scaling-stroke}
.evp{fill:#3A74E8}.evt{fill:#fff;font-family:Inter,sans-serif;font-weight:700;text-anchor:middle}

.seg button.on{background:#3A3A3A;color:#fff}
.seg button:disabled{opacity:.35;cursor:default}
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.aempty h2{font-size:15px;margin:2px 0 4px}
.aempty p{color:var(--mut);margin:0 0 12px}
.sgl{display:flex;flex-direction:column;gap:6px}
.sg{border:1px solid var(--bd2);background:#2A2A2A;border-radius:8px;padding:8px 10px;text-align:left;color:#D6D6D6;font-size:12.5px}
.sg:hover:not(:disabled){border-color:#5A5A5A;background:#303030}
.sg:disabled{opacity:.45;cursor:default}
.sg small{color:var(--fnt);margin-left:6px}
.uq{align-self:flex-end;background:#3A3A3A;border-radius:12px 12px 3px 12px;padding:7px 11px;max-width:88%}

.ans.act{border-color:#4A6FB0;box-shadow:0 0 0 1px #4A6FB0}
.ahead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.asc{color:var(--mut);font-size:13px}
.pill{font-size:11.5px;border-radius:10px;padding:1px 8px;white-space:nowrap}
.pill.ok{background:#22382A;color:var(--ok)}.pill.chk{background:#40311B;color:var(--org)}.pill.no{background:#3A2424;color:#E89A9A}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font:500 30px/1 'JetBrains Mono',monospace;color:var(--blue2)}
.big .u{color:#CFCFCF;font-size:14px}
.atext{color:#D6D6D6}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:88px 1fr 50px;align-items:center;gap:8px;border:0;background:none;padding:3px 4px;border-radius:5px;text-align:left;font-size:12px;color:#C8C8C8}
.bar:hover{background:#343434}
.bar.cur{background:#2B3750}
.bar .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{display:block;height:8px;border-radius:3px;background:var(--blue);min-width:2px}
.bar .bv{font-family:'JetBrains Mono',monospace;text-align:right}
.bar.na{color:var(--fnt)}
.evs{display:flex;flex-wrap:wrap;gap:4px}
.ev{border:0;background:var(--bdg);color:#fff;font:600 11px 'JetBrains Mono',monospace;border-radius:9px;padding:1px 7px}
.ev:hover{filter:brightness(1.2)}
details.how summary{cursor:pointer;color:var(--mut);font-size:12px}
details.how summary:hover{color:var(--ink)}
.calc{margin-top:6px;font:12.5px/1.55 'JetBrains Mono',monospace;color:#9FB6DA;background:#212121;border-radius:6px;padding:6px 8px;white-space:pre-wrap;word-break:break-word}
.afoot{margin-top:5px;font-size:11.5px;color:var(--fnt)}
.aact{display:flex;gap:12px;align-items:center}
.alink{border:0;background:none;color:var(--blue2);padding:0;font-size:12px}
.alink.mut{color:var(--mut)}
.composer{border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--bd2);background:var(--fld);border-radius:9px;padding:9px 11px;min-height:40px;max-height:120px;line-height:1.4}
.composer textarea:focus{outline:none;border-color:var(--blue)}
.send{width:40px;height:40px;border:0;border-radius:9px;background:var(--bdg);color:#fff;display:grid;place-items:center;flex:none}

/* modal, toast, status */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:16px}

.mbox h2{margin:0 0 4px;font-size:16px}
.mbox h3{margin:16px 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fnt);font-weight:500}
.mbox .sub{color:var(--mut);margin:0 0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:#4A6FB0;background:#22304A}
.opt input[type=radio]{margin-top:3px}
.opt b{display:block}
.opt span{color:var(--mut);font-size:12.5px}
.fld{flex:1;height:32px;border:1px solid var(--bd2);background:var(--fld);border-radius:7px;padding:0 9px}
.mrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.steps{margin:6px 0 0;padding-left:18px;line-height:1.7;color:#D6D6D6}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;color:#CFCFCF}
.keys kbd{font:500 11.5px 'JetBrains Mono',monospace;background:#1E1E1E;border:1px solid #3A3A3A;border-radius:4px;padding:1px 6px;color:#E4E4E4}

.toast button{border:0;background:none;color:var(--blue2);font-weight:600;padding:0}
.status{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--hdr);border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden}

@media (max-width:1180px){.body{grid-template-columns:240px minmax(0,1fr) 316px}.pname{width:150px}}

}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</div>

<script>
'use strict';
/* =====================================================================

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>(Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const fi1=n=>(Math.round(n*10)/10).toFixed(1).replace('.',',');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* =====================================================================
   1. Vocabulary. Finnish plan codes give the room type almost for free.
   ===================================================================== */
const RT={
  Living:{fi:'OH',en:'Living room',pl:'living rooms'},Bedroom:{fi:'MH',en:'Bedroom',pl:'bedrooms'},Kitchen:{fi:'K',en:'Kitchen',pl:'kitchens'},
  Dining:{fi:'RT',en:'Dining room',pl:'dining rooms'},Bathroom:{fi:'KH',en:'Bathroom',pl:'bathrooms'},Sauna:{fi:'S',en:'Sauna',pl:'saunas'},
  WC:{fi:'WC',en:'WC',pl:'WCs'},Hall:{fi:'ET',en:'Hall',pl:'halls'},Corridor:{fi:'KÄYTÄVÄ',en:'Corridor',pl:'corridors'},
  Closet:{fi:'VH',en:'Closet',pl:'closets'},Storage:{fi:'VAR',en:'Storage',pl:'storage rooms'},Utility:{fi:'KHH',en:'Utility room',pl:'utility rooms'},
  Balcony:{fi:'PARV',en:'Balcony',pl:'balconies'},Office:{fi:'TSTO',en:'Office',pl:'offices'},Meeting:{fi:'NEUV',en:'Meeting room',pl:'meeting rooms'},
  OpenOffice:{fi:'AVOTSTO',en:'Open office',pl:'open offices'},Stair:{fi:'PORRAS',en:'Stair',pl:'stairs'},Lift:{fi:'HISSI',en:'Lift',pl:'lifts'},
  Technical:{fi:'TEKN',en:'Technical room',pl:'technical rooms'},Lobby:{fi:'AULA',en:'Lobby',pl:'lobbies'},Bike:{fi:'PVH',en:'Bike storage',pl:'bike storages'},
  Wash:{fi:'PH',en:'Wash room',pl:'wash rooms'},Room:{fi:'H',en:'Room',pl:'rooms'}
};
const KIND={door:['door','doors'],window:['window','windows'],toilet:['toilet','toilets'],sink:['sink','sinks'],kitchen_sink:['kitchen sink','kitchen sinks'],shower:['shower','showers'],bathtub:['bathtub','bathtubs'],sauna_stove:['sauna stove','sauna stoves'],other:['fixture','fixtures']};
const TYPEMAP={bedroom:'Bedroom',living:'Living',kitchen:'Kitchen',dining:'Dining',bathroom:'Bathroom',wc:'WC',sauna:'Sauna',hall:'Hall',corridor:'Corridor',closet:'Closet',storage:'Storage',utility:'Utility',balcony:'Balcony',office:'Office',meeting:'Meeting',stair:'Stair',technical:'Technical',other:'Room'};
const FIXK={toilet:'toilet',wc:'toilet',sink:'sink',basin:'sink',washbasin:'sink',wash_basin:'sink',kitchen_sink:'kitchen_sink',shower:'shower',bathtub:'bathtub',bath:'bathtub',sauna_stove:'sauna_stove',stove:'sauna_stove'};
/* printed labels -> room types (Finnish plan codes first, then common words in the Stoa languages) */
const LABEL_TYPES=[
  ['Bathroom',/^(kh|kph|ph|pesuh|pesuhuone|kylpyhuone|sh|suihku|bad|bain|bagno|dusche|douche|bathroom|bath)$/],
  ['WC',/^(wc|toilette|toilet)$/],
  ['Sauna',/^(s|su|sauna|löylyhuone)$/],
  ['Bedroom',/^(mh|makuuhuone|makuuh|bedroom|schlafzimmer|chambre|camera)$/],
  ['Kitchen',/^(k|kt|kk|tk|ak|keittiö|keittokomero|tupakeittiö|avokeittiö|apukeittiö|keittiötila|küche|kuche|cuisine|cucina|kochen|kitchen|kitchenette)$/],
  ['Balcony',/^(parv|parveke|lasitettu|lasit|balkon|balcon|balcone|loggia|terrasse|terrace|balcony)$/],
  ['Living',/^(oh|olohuone|tupa|wohnen|wohnzimmer|living|séjour|sejour|soggiorno)$/],
  ['Hall',/^(et|eteinen|hall|entrée|entree|eingang|ingresso)$/],
  ['Closet',/^(vh|vaatehuone|wardrobe|closet)$/],
  ['Storage',/^(var|varasto|reduit|réduit|abstellraum|storage|ripostiglio|cellier)$/],
  ['Utility',/^(khh|kodinhoitohuone|utility|laundry|buanderie)$/],
  ['Corridor',/^(käytävä|corridor|korridor|flur|dégagement|degagement|disimpegno)$/],
  ['Stair',/^(porras|porrashuone|treppenhaus|treppe|escalier|stair|stairs|scala)$/],
];
function labelTypes(label){const out=new Set();String(label||'').toLowerCase().split(/[\s\/+,.&()\-]+/).filter(t=>t&&!/^[\d.,m²]+$/.test(t)).forEach(t=>{for(const[ty,re]of LABEL_TYPES)if(re.test(t)){out.add(ty);break;}});
  if(out.has('Bathroom'))out.delete('WC');return out;} // a WC inside a bathroom is not a separate WC room
const typeFromLabel=l=>{const s=labelTypes(l);return s.size?[...s][0]:null;};

function guessLevel(name){const n=name.toLowerCase();const m=n.match(/(?:krs|kerros|floor|level|lvl|storey|plan)[ _.-]?(-?\d{1,2})/)||n.match(/(?:^|[^a-z0-9])k(\d{1,2})(?:[^0-9]|$)/)||n.match(/(\d{1,2})(?:st|nd|rd|th)?[ _.-]?(?:floor|krs|kerros)/)||n.match(/\bp(\d{1,2})$/);return m?+m[1]:null;}
async function addFiles(files,o={}){
  const b=bld(o.bId||ST.bId);let at=o.at==null?b.floors.length:o.at;const base=n=>n.replace(/\.[^.]+$/,'').toLowerCase(),srcs=[],jsons=[],bad=[];
  if(files.some(f=>/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)))toast('Opening the PDF…');
  for(const f of files){
    if(/\.json$/i.test(f.name)||f.type==='application/json')jsons.push(f);
    else if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){try{(await pdfPages(f)).forEach(p=>srcs.push(p));}catch(e){console.warn(e);bad.push(f.name+' (could not open the PDF here; export its pages as PNG)');}}
    else if(/^image\//.test(f.type))srcs.push({name:f.name,file:f});else bad.push(f.name);}
  const js={};for(const j of jsons){try{js[base(j.name)]=JSON.parse(await j.text());}catch(e){bad.push(j.name+' (not valid JSON)');}}
  if(srcs.length>1&&srcs.every(s=>guessLevel(s.name)!=null))srcs.sort((a,c)=>guessLevel(a.name)-guessLevel(c.name));
  else if(srcs.length>1&&!srcs.some(s=>s.canvas))srcs.sort((a,c)=>a.name.localeCompare(c.name,undefined,{numeric:true}));
  const made=[];
  for(const s of srcs){let P;try{P=s.canvas?await prepDrawable(s.canvas,s.canvas.width,s.canvas.height,s.name):await prepFile(s.file);if(s.canvas){P.origCanvas=s.canvas;P.hiSrc=s.canvas;P.hiUrl=URL.createObjectURL(await origBlob(P));}}catch(e){bad.push(s.name);continue;}
    const k=base(s.name),j=js[k];if(j)delete js[k];made.push(makeFloor(b.id,{src:'upload',file:s.name,img:P,schemaJson:j||null,meta:{name:s.file?s.file.name:s.name,bytes:s.file?s.file.size:null,page:s.page||null,pages:s.pages||null}}));}
  Object.keys(js).forEach(k=>made.push(makeFloor(b.id,{src:'json',file:k+'.json',schemaJson:js[k]})));

  ST.bId=b.id;ST.fid=made[made.length-1].id;if(b.floors.length===made.length)T3.framed=false;
  if(ST.scopeMode==='auto')autoScope();renderAll();made.forEach(queueRead);if(ST.trOpen)setTrace(null,'reading');
  toast(`Added ${made.length} floor${made.length>1?'s':''}.${made.length>1?' Drag them if the order is wrong.':''}${bad.length?` Skipped: ${bad.join(', ')}.`:''}`);
}

   <li><b>Put them in order.</b> Drag cards up or down; the top card is the top floor. Drop a card on a building tab to move it there.</li>
   <li><b>Let it read.</b> Our model reads the floors in parallel and returns a schema: rooms, doors, windows, fixtures and the scale. Each step shows live in the trace.</li>
   <li><b>Look around.</b> Plan shows one floor with what was read. 3D stacks the building, built from the schema alone.</li>
   <li><b>Ask.</b> About a floor, the building, or all buildings. Answers are plain code over the schema: every item is marked, and the trace shows each step and its cost.</li></ol>
  <h3>Shortcuts</h3><div class="keys"><kbd>P</kbd><span>Plan view</span><kbd>3</kbd><span>3D view</span><kbd>T</kbd><span>Show or hide the trace</span><kbd>R</kbd><span>Show or hide what was read</span><kbd>↑ ↓</kbd><span>Floor above or below</span><kbd>Alt ↑ ↓</kbd><span>Move the floor up or down</span><kbd>F</kbd><span>Frame the view</span><kbd>Delete</kbd><span>Delete the floor (with undo)</span></div>
  <div class="mact"><button class="btn pri" data-act="close">Got it</button></div>`);}
function requeueNokey(){Object.values(FL).forEach(f=>{if(!f.deleted&&f.status==='nokey')queueRead(f);});renderStatus();}
function readerLabel(){return`our model · ${hostOf(CFG.endpoint)}${CFG.proto?'':CFG.probing?' · checking…':' · not connected'}`;}
async function probeModel(ep){ep=String(ep||'').replace(/\/$/,'');if(!ep)return null;
  try{const r=await fetch(ep+'/analyze');if([200,405,422].includes(r.status))return'analyze';}catch(e){}
  try{const r=await fetch(ep+'/api/scene?id=probe'),j=await r.json().catch(()=>null);if(r.status===404&&j&&/plan not found/i.test(j.error||''))return'scene';}catch(e){}
  return null;}
function renderStatus(){const fs=Object.values(FL).filter(f=>!f.deleted),rd=fs.filter(isRead).length,ing=fs.filter(f=>f.status==='reading').length,wait=fs.filter(f=>f.status==='queued').length;
  $('#stat').textContent=fs.length?`${rd}/${fs.length} floors read${ing||wait?` · reading ${ing}${wait?`, ${wait} waiting`:''}, up to ${poolSize()} at a time`:''} · reader: ${readerLabel()}`:`Reader: ${readerLabel()}`;
  const tl=$('#trLive');if(tl)tl.hidden=!(ing||wait);}
function renderHint(){$('#hint').textContent=!curB().floors.length?'Add floor plans to start, or try the sample building.':ST.view==='3d'?'Click a floor to pick it, click it again to open its plan':'Scroll to zoom · drag to pan · click a room · ↑ ↓ change floor · drag cards to reorder';}
function exportCSV(){const rows=[['building','floor','name','file','status','rooms','doors','windows','toilets','saunas','area_m2']];
  PROJ.buildings.forEach(b=>b.floors.forEach((id,i)=>{const f=FL[id],sc=f.schema,c=k=>sc?sc.items.filter(x=>x.kind===k).length:'';rows.push([b.name,i+1,fname(f),f.file,f.status,sc?sc.rooms.length:'',c('door'),c('window'),c('toilet'),sc?sc.rooms.filter(r=>r.type==='Sauna').length:'',sc?sc.rooms.reduce((a,r)=>a+(roomArea(sc,r)||0),0).toFixed(2):'']);}));
  download(`blueline-quantities-${new Date().toISOString().slice(0,10)}.csv`,rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(',')).join('\n'),'text/csv');}
function exportJSON(){const strip=sc=>JSON.parse(JSON.stringify(sc,(k,v)=>k.startsWith('_')?undefined:v));
  download(`blueline-floors-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({project:PROJ.name,buildings:PROJ.buildings.map(b=>({name:b.name,floors:b.floors.map((id,i)=>({level:i+1,name:fname(FL[id]),file:FL[id].file,schema:FL[id].schema?strip(FL[id].schema):null}))}))},null,1),'application/json');}

/* =====================================================================
   12. Events
   ===================================================================== */
function renderAll(){renderTabs();renderList();updateEmpty();if(ST.view==='plan')renderPlan();else sync3D();renderScope();renderAskEmpty();renderStatus();renderHint();trSoon();}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-q],[data-sc],[data-tt],.btab[data-b]');if(!t)return;
  if(t.dataset.tt){setTrace(null,t.dataset.tt);return;}
  if(t.dataset.q){if(!t.disabled)ask(t.dataset.q);return;}
  if(t.dataset.sc){ST.scopeMode='manual';ST.scope=t.dataset.sc==='floor'?{type:'floor',id:ST.fid}:t.dataset.sc==='building'?{type:'building',id:ST.bId}:{type:'project'};renderScope();renderAskEmpty();return;}
  const a=t.dataset.act,card=t.closest('.fc'),fid=t.dataset.f||(card&&card.dataset.f);
  if(!a&&t.classList.contains('btab')){if(t.dataset.b!==ST.bId&&!t.querySelector('input'))setBuilding(t.dataset.b);return;}
  switch(a){
    case 'choose':$('#file').click();break;
    case 'sample':loadSample();break;
    case 'addb':{const b=newBuilding();setBuilding(b.id);toast(`${b.name} added. Add its floor plans.`);break;}
    case 'delb':e.stopPropagation();deleteBuilding(t.dataset.b);break;
    case 'stop':{const f=FL[fid||ST.fid];if(f&&f.ctl)f.ctl.abort();break;}
    case 'reread':{const f=FL[fid||ST.fid];if(f){f.errShort='';queueRead(f);}break;}
    case 'rename':startRename(fid);break;
    case 'del':deleteFloor(fid);break;
    case 'flup':case 'fldn':{const b=curB(),i=b.floors.indexOf(ST.fid),j=i+(a==='flup'?1:-1);if(b.floors[j])selectFloor(b.floors[j]);break;}
    case 'zi':zoomAt(1/1.3);break;case 'zo':zoomAt(1.3);break;case 'fit':fitPlan();drawEvidence();break;
    case 'trace':ST.trace=!ST.trace;renderVnav();drawTrace();renderLegend();break;
    case 'desel':ST.sel=null;drawHit();renderInspect();break;
    case 'settings':settingsModal();break;
    case 'clearans':clearActive();break;
    case 'show':activate(+t.dataset.ans);break;
    case 'bar':{const A=ANS[t.dataset.ans];if(A)ST.active=A;selectFloor(t.dataset.f);refreshAnswerViews();break;}
    case 'ev':{const A=ANS[t.dataset.ans];if(A)ST.active=A;const go=()=>{selectFloor(t.dataset.f);refreshAnswerViews();const f=FL[t.dataset.f],it=f&&f.schema&&f.schema.items.find(i=>i.id===t.dataset.ev);if(it)zoomToBox(it.box);};if(ST.view!=='plan')setView('plan').then(go);else go();break;}
    case 'sel3':selectFloor(fid,{from3d:1});break;
    case 'iso':T3.iso=!T3.iso;renderCtl3();sync3D();frame3D(true);break;
    case 'reset3':frame3D(true);break;
    case 'readall':closeModal();Object.values(FL).forEach(f=>{if(!f.deleted&&PROJ.buildings.some(b=>b.floors.includes(f.id)))queueRead(f);});break;
    case 'exportjson':exportJSON();break;case 'exportcsv':exportCSV();break;
    case 'close':closeModal();break;
    case 'trclose':setTrace(false);break;
    case 'opentr':ST.trN=+t.dataset.ans;setTrace(true,'answer');break;
    case 'trf':selectFloor(fid);setTrace(null,'reading');break;
    case 'trraw':ST.trRaw=!ST.trRaw;renderTrace();break;
  }
});
document.addEventListener('dblclick',e=>{const nm=e.target.closest('.fnm');if(nm&&!nm.querySelector('input')){startRename(nm.closest('.fc').dataset.f);return;}const tab=e.target.closest('.btab[data-b]');if(tab&&!e.target.closest('.bx')&&!tab.querySelector('input'))renameBuilding(tab.dataset.b);});
document.addEventListener('input',e=>{if(e.target.id==='spread'){T3.spread=+e.target.value;sync3D();}});
$('#flist').addEventListener('mouseover',e=>{const c=e.target.closest('.fc'),id=c?c.dataset.f:null;if(id!==T3.hoverList){T3.hoverList=id;paint3D();}});
$('#flist').addEventListener('mouseleave',()=>{T3.hoverList=null;paint3D();});
$('#flist').addEventListener('keydown',e=>{const c=e.target.closest('.fc');if(!c||e.target.tagName==='INPUT')return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();selectFloor(c.dataset.f);}
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();e.stopPropagation();moveFloor(c.dataset.f,e.key==='ArrowUp'?1:-1);}});
$('#vPlan').onclick=()=>setView('plan');$('#v3d').onclick=()=>setView('3d');
$('#setBtn').onclick=settingsModal;$('#trBtn').onclick=()=>setTrace(!ST.trOpen);$('#helpBtn').onclick=helpModal;$('#upBtn').onclick=()=>$('#file').click();$('#fadd').onclick=()=>$('#file').click();
$('#pname').addEventListener('change',e=>{PROJ.name=e.target.value.trim()||'My project';});
$('#file').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)addFiles(fs);});
$('#comp').addEventListener('submit',e=>{e.preventDefault();const q=$('#q');ask(q.value);q.value='';q.style.height='';});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#comp').requestSubmit();}});
$('#q').addEventListener('input',e=>{e.target.style.height='';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden){closeModal();return;}if(ST.sel){ST.sel=null;drawHit();renderInspect();return;}}
  if(/input|textarea|select/i.test((document.activeElement||{}).tagName||'')||!$('#modal').hidden||e.metaKey||e.ctrlKey)return;
  const b=curB(),i=b.floors.indexOf(ST.fid);
  if(e.key==='p'||e.key==='P')setView('plan');else if(e.key==='3')setView('3d');
  else if((e.key==='ArrowUp'||e.key==='ArrowDown')&&ST.fid){e.preventDefault();if(e.altKey)moveFloor(ST.fid,e.key==='ArrowUp'?1:-1);else{const j=i+(e.key==='ArrowUp'?1:-1);if(b.floors[j])selectFloor(b.floors[j]);}}
  else if(e.key==='f'||e.key==='F'){if(ST.view==='plan'){fitPlan();drawEvidence();}else frame3D(true);}
  else if(e.key==='t'||e.key==='T')setTrace(!ST.trOpen);
  else if(e.key==='r'||e.key==='R'){ST.trace=!ST.trace;renderVnav();drawTrace();renderLegend();}
  else if((e.key==='Delete'||e.key==='Backspace')&&ST.fid){e.preventDefault();deleteFloor(ST.fid);}
});
/* dropping files: on the floor list they go in at the drop position; anywhere else they go on top */
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
let dragDepth=0;
document.addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth++;$('#vw').classList.add('dropping');});
document.addEventListener('dragleave',e=>{if(!hasFiles(e))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth){$('#vw').classList.remove('dropping');hideIns();}});
document.addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();if(!e.target.closest||!e.target.closest('#flist'))hideIns();});
document.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$('#vw').classList.remove('dropping');const inList=e.target.closest&&e.target.closest('#flist'),at=inList?insAt(e.clientY):null;hideIns();addFiles([...e.dataTransfer.files],{at});});
function insAt(y){const cards=[...$('#flist').querySelectorAll('.fc')],n=cards.length;let i=n;for(let j=0;j<n;j++){const r=cards[j].getBoundingClientRect();if(y<r.top+r.height/2){i=j;break;}}return n-i;}
$('#flist').addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();const list=$('#flist'),cards=[...list.querySelectorAll('.fc')];if(!cards.length)return;
  const n=cards.length,at=insAt(e.clientY),i=n-at,top=i<n?cards[i].offsetTop:cards[n-1].offsetTop+cards[n-1].offsetHeight+6;
  let el=$('#insl');if(!el){el=document.createElement('div');el.id='insl';el.className='insl';list.appendChild(el);}el.style.top=top+'px';});
function hideIns(){const el=$('#insl');if(el)el.remove();}
new ResizeObserver(()=>{if(ST.view==='plan'){applyVB();drawEvidence();}else size3D();}).observe($('#vw'));
(()=>{const gr=$('#tgrip');let d=null; // drag the top edge of the trace to resize it
  gr.addEventListener('pointerdown',e=>{d={y:e.clientY,h:$('#trace').offsetHeight};gr.setPointerCapture(e.pointerId);e.preventDefault();});
  gr.addEventListener('pointermove',e=>{if(!d)return;$('#trace').style.setProperty('--trh',clamp(d.h-(e.clientY-d.y),110,Math.round(innerHeight*.7))+'px');});
  gr.addEventListener('pointerup',()=>{if(d)store.set('bl_trh',$('#trace').offsetHeight);d=null;});})();

/* =====================================================================
   13. Boot
   ===================================================================== */
$('#vPlan').innerHTML=I.plan+'<span>Plan</span>';$('#v3d').innerHTML=I.cube+'<span>3D</span>';
$('#helpBtn').innerHTML=I.help;$('#setBtn').innerHTML=I.gear;$('#upIc').innerHTML=I.upl;$('#send').innerHTML=I.send;
$('#fadd').innerHTML=I.plus+'<span>Add floor plans</span>';
$('#trIc').innerHTML=I.trace;$('#trclose').innerHTML=I.x;
ST.trOpen=store.get('bl_tr',true);{const th=store.get('bl_trh',0);if(th)$('#trace').style.setProperty('--trh',th+'px');}
renderEmpty();renderVnav();renderCtl3();renderAll();setTrace(null);
setInterval(()=>{if(ST.trOpen&&ST.trTab==='reading'&&anyReading())renderTrace();},500);
/* served by the team's model server itself? then it can read the floors with no setup */

window.BL={PROJ,FL,ST,T3,ANS,CFG,ask,answer,parseQ,evalSheet,addFiles,loadSample,setView,selectFloor,moveFloor,deleteFloor,queueRead,setTrace,poolSize,wallModel,fromTeamSchematic,fromTeamScene};
</script>
