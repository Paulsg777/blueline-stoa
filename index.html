<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueline for Stoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Blueline V4 (2026-11-14)
   One project holds several buildings, each building holds up to 8+ floor sheets.
   Every sheet is read ONCE by a swappable "reader" into schema.json, then every
   question is answered in code over those schemas, at floor, building or project scope.
   Palette: greys #1C1C1C..#2E2E2E, ink #E4E4E4, Blueline blue #5B95FF, orange #E8A33D only for checks. */
:root{color-scheme:dark;--app:#1C1C1C;--hdr:#262626;--side:#232323;--box:#2B2B2B;--box2:#313131;--fld:#1F1F1F;--vp:#2D2D2D;--bd:#151515;--bd2:#3A3A3A;--ink:#E4E4E4;--mut:#9A9A9A;--fnt:#6E6E6E;--blue:#5B95FF;--blue2:#8DB6FF;--bdg:#3A74E8;--bsel:#2B4677;--org:#E8A33D;--ok:#7CC48A;--red:#E06C6C}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mono{font-family:'JetBrains Mono',monospace}
.app{display:grid;grid-template-rows:40px minmax(0,1fr) 26px;height:100%}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--hdr);border-bottom:1px solid var(--bd)}
.logo{position:relative;font:800 15px/1 Inter,sans-serif;letter-spacing:-.03em;color:#F2F2F2;flex:none}
.logo i{position:absolute;left:-3px;right:-3px;top:52%;height:1.5px;background:var(--blue);transform-origin:left;animation:slice .8s cubic-bezier(.65,0,.35,1) .15s both}
@keyframes slice{from{transform:scaleX(0)}}
.sep{width:1px;height:14px;background:var(--bd2);flex:none}
.crumbs{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.crumbs button{border:0;background:none;color:var(--mut);padding:3px 5px;border-radius:4px}
.crumbs button:hover{background:#333;color:var(--ink)}
.crumbs button:last-child{color:var(--ink)}
.crumbs .cs{color:var(--fnt)}
.sp{flex:1}
.hb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border:0;border-radius:6px;background:#3A3A3A;font-size:12.5px;white-space:nowrap}
.hb:hover{background:#474747}
.hb.pri{background:var(--bdg);color:#fff}.hb.pri:hover{background:#4A82F0}
.rdr{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border:1px solid var(--bd2);border-radius:6px;background:#2A2A2A;font-size:12px;color:#CFCFCF;white-space:nowrap}
.rdr:hover{border-color:#555}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.api{background:var(--blue)}
#menu{display:none}

/* body grid */
.body{display:grid;grid-template-columns:236px minmax(0,1fr) 370px;gap:1px;background:var(--bd);min-height:0}
.rail,.side{background:var(--side);min-height:0;overflow:auto}
.main{position:relative;background:var(--app);min-height:0;overflow:auto}

/* rail */
.rail{padding:10px 8px 20px}
.rh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fnt);padding:10px 8px 6px;display:flex;align-items:center}
.ri{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;color:#D0D0D0}
.ri:hover{background:#2E2E2E}
.ri.on{background:var(--bsel);color:#fff}
.ri .n{margin-left:auto;font:11.5px 'JetBrains Mono',monospace;color:var(--mut)}
.ri.on .n{color:#DCE7FF}
.ri .badge{margin-left:auto;font:600 11px 'JetBrains Mono',monospace;background:var(--bdg);color:#fff;border-radius:9px;padding:0 7px;line-height:17px}
.ri .badge.z{background:#3A3A3A;color:#999}
.rb{font-weight:600}
.rb .k{width:18px;height:18px;border-radius:4px;background:#3A3A3A;display:grid;place-items:center;font:700 11px Inter;color:#DDD;flex:none}
.rf{padding-left:30px;font-size:12.5px}
.sd{width:7px;height:7px;border-radius:50%;flex:none;background:#555}
.sd.read{background:var(--ok)}.sd.reading{background:var(--blue);animation:pulse 1s infinite}.sd.queued{background:#666}.sd.needs_model{background:var(--org)}.sd.error{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.addb{color:var(--mut);font-size:12.5px}

/* side ask panel */
.side{display:flex;flex-direction:column;overflow:hidden}
.scope{padding:10px 12px;border-bottom:1px solid var(--bd)}
.scl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fnt);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#1D1D1D;border:1px solid var(--bd2);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:5px;padding:5px 4px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:#3A3A3A;color:#fff}
.seg button:disabled{opacity:.35;cursor:default}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.empty h2{font-size:15px;margin:6px 0 4px}
.empty p{color:var(--mut);margin:0 0 12px}
.sgl{display:flex;flex-direction:column;gap:6px}
.sg{border:1px solid var(--bd2);background:#2A2A2A;border-radius:7px;padding:7px 10px;text-align:left;color:#D6D6D6;font-size:12.5px}
.sg:hover{border-color:#555;background:#303030}
.sg small{color:var(--fnt);margin-left:6px}
.uq{align-self:flex-end;background:#3A3A3A;border-radius:10px 10px 2px 10px;padding:7px 11px;max-width:88%}
.ans{background:var(--box);border:1px solid var(--bd2);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.ans.act{border-color:var(--bsel);box-shadow:0 0 0 1px var(--bsel)}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font:500 30px/1 'JetBrains Mono',monospace;color:var(--blue2)}
.big .u{color:#CFCFCF;font-size:14px}
.pill{font-size:11.5px;border-radius:10px;padding:1px 8px;white-space:nowrap}
.pill.ok{background:#22382A;color:var(--ok)}
.pill.chk{background:#40311B;color:var(--org)}
.pill.no{background:#3A2424;color:#E89A9A}
.pill.inf{background:#24324A;color:var(--blue2)}
.asc{color:var(--mut);font-size:12px}
.atext{color:#D6D6D6}
.bars{display:flex;flex-direction:column;gap:3px}
.bar{display:grid;grid-template-columns:86px 1fr 46px;align-items:center;gap:8px;border:0;background:none;padding:2px 3px;border-radius:4px;text-align:left;font-size:12px;color:#C8C8C8}
.bar:hover{background:#333}
.bar.cur{background:#2B3750}
.bar i{display:block;height:8px;border-radius:3px;background:var(--blue);min-width:2px}
.bar i.f{background:var(--org)}
.bar span:last-child{font-family:'JetBrains Mono',monospace;text-align:right}
.bar.na{color:var(--fnt)}
.evs{display:flex;flex-wrap:wrap;gap:4px}
.ev{border:0;background:var(--bdg);color:#fff;font:600 11px 'JetBrains Mono',monospace;border-radius:9px;padding:1px 7px}
.ev.f{background:#B27A23}
.ev:hover{filter:brightness(1.2)}
.calc{font:11.5px/1.5 'JetBrains Mono',monospace;color:#9FB6DA;background:#222;border-radius:6px;padding:6px 8px;white-space:pre-wrap;word-break:break-word}
.afoot{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--fnt)}
.afoot b{color:#BBB;font-weight:500}
.alink{border:0;background:none;color:var(--blue2);padding:0;font-size:12px}
.composer{border-top:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--bd2);background:var(--fld);border-radius:8px;padding:8px 10px;min-height:38px;max-height:120px;line-height:1.4}
.send{width:38px;height:38px;border:0;border-radius:8px;background:var(--bdg);color:#fff;font-size:16px;flex:none}
.send:hover{background:#4A82F0}

/* views */
.view{padding:18px 22px 30px;max-width:1280px}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vh h1{font-size:19px;margin:0;letter-spacing:-.01em}
.vh p{margin:2px 0 0;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.tile{background:var(--box);border:1px solid var(--bd2);border-radius:9px;padding:9px 11px}
.tile b{display:block;font:500 21px/1.2 'JetBrains Mono',monospace;color:#EDEDED}
.tile span{color:var(--mut);font-size:12px}
.tile.bl b{color:var(--blue2)}
.card{background:var(--box);border:1px solid var(--bd2);border-radius:10px;padding:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ch h3{margin:0;font-size:14px}
.ch .k{width:22px;height:22px;border-radius:5px;background:#3A3A3A;display:grid;place-items:center;font:700 12px Inter}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.kv div{background:#242424;border-radius:6px;padding:5px 8px}
.kv b{display:block;font:500 15px 'JetBrains Mono',monospace}
.kv span{font-size:11px;color:var(--mut)}
.pipe{display:flex;align-items:stretch;gap:0;margin:4px 0 18px;flex-wrap:wrap}
.ps{flex:1 1 120px;background:var(--box);border:1px solid var(--bd2);padding:9px 11px;position:relative}
.ps:first-child{border-radius:9px 0 0 9px}.ps:last-child{border-radius:0 9px 9px 0}
.ps+.ps{border-left:0}
.ps b{display:block;font-size:12.5px}
.ps span{font-size:11.5px;color:var(--mut)}
.ps.swap{background:#22304A;border-color:#34507F;cursor:pointer}
.ps.swap b{color:var(--blue2)}
.prog{height:4px;background:#2E2E2E;border-radius:2px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.two{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:16px;align-items:start}
.stack svg{width:100%;height:auto;display:block}
.slab{cursor:pointer}
.slab:hover .tp{stroke:#fff;stroke-width:1.6}
.slab.cur .tp{stroke:var(--blue2);stroke-width:2}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.th{border:1px solid var(--bd2);background:var(--box);border-radius:9px;padding:0;text-align:left;overflow:hidden}
.th:hover{border-color:#5A5A5A}
.th svg{display:block;width:100%;height:auto;background:#262626}
.th .tc{padding:7px 9px;display:flex;align-items:center;gap:7px;font-size:12px}
.th .tc .bn{margin-left:auto;font:600 11px 'JetBrains Mono',monospace;background:var(--bdg);color:#fff;border-radius:9px;padding:0 7px}
.th .tm{padding:0 9px 8px;color:var(--mut);font-size:11.5px}
.sel{height:28px;border:1px solid var(--bd2);background:var(--fld);border-radius:6px;padding:0 8px}
table.tk{border-collapse:collapse;width:100%;font-size:12.5px}
.tk th,.tk td{padding:6px 9px;border-bottom:1px solid #2F2F2F;text-align:right;white-space:nowrap}
.tk th:first-child,.tk td:first-child{text-align:left}
.tk th{color:var(--mut);font-weight:500;position:sticky;top:0;background:var(--app)}
.tk td{font-family:'JetBrains Mono',monospace}
.tk td:first-child{font-family:Inter}
.tk tr.sub td{background:#242424;font-weight:600}
.tk tr.tot td{background:#22304A;font-weight:600;color:#DCE7FF}
.tk tr.rw{cursor:pointer}.tk tr.rw:hover td{background:#262626}
.tk .fl{color:var(--org)}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rc{background:var(--box);border:1px solid var(--bd2);border-radius:10px;overflow:hidden}
.rc svg{display:block;width:100%;height:150px;background:#262626}
.rc .rb2{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.rc .rr{display:flex;gap:6px}
.rc .rr button{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;border:0;border-radius:6px;background:#3A3A3A;font-size:12.5px;white-space:nowrap}
.btn:hover{background:#474747}
.btn.pri{background:var(--bdg);color:#fff}.btn.pri:hover{background:#4A82F0}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.note{color:var(--mut);font-size:12px;background:#242424;border:1px solid #2F2F2F;border-radius:8px;padding:9px 11px;margin:10px 0}
.note b{color:#D6D6D6;font-weight:500}
.match{color:var(--ok)}.miss{color:var(--red)}.abst{color:var(--org)}

/* floor viewer */
.fv{position:absolute;inset:0;display:grid;grid-template-columns:62px minmax(0,1fr);background:var(--vp)}
.fstrip{background:#232323;border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:stretch;padding:8px 6px;gap:4px;overflow:auto}
.fstrip .fl2{font-size:10.5px;color:var(--fnt);text-align:center;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.fb{position:relative;border:1px solid #383838;background:#2A2A2A;border-radius:6px;height:34px;font:600 13px 'JetBrains Mono',monospace;color:#CFCFCF}
.fb:hover{border-color:#5A5A5A}
.fb.on{background:var(--bsel);border-color:#4A6FB0;color:#fff}
.fb .bn{position:absolute;right:-5px;top:-6px;font:600 10px 'JetBrains Mono',monospace;background:var(--bdg);color:#fff;border-radius:8px;padding:0 5px;line-height:15px}
.fb .bn.f{background:#B27A23}
.fb.st-needs_model{border-style:dashed;border-color:var(--org)}
.vpw{position:relative;overflow:hidden;touch-action:none;cursor:grab}
.vpw.drag{cursor:grabbing}
#vsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ovl{position:absolute;z-index:2}
.vlab{left:12px;top:10px;font-size:12px;color:#C4C4C4;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.vlab b{color:#EEE;font-weight:600}
.vlab .l3{font:12px 'JetBrains Mono',monospace;color:var(--blue2)}
.vnav{right:12px;top:10px;display:flex;flex-direction:column;gap:4px}
.nb{width:30px;height:30px;border:0;border-radius:50%;background:rgba(40,40,40,.9);color:#D0D0D0;display:grid;place-items:center;font-size:15px}
.nb:hover{background:#444}
.nb.off{color:#666}
.cnt{left:12px;bottom:12px;display:flex;align-items:baseline;gap:8px;background:rgba(30,30,30,.92);border:1px solid var(--bd2);border-radius:8px;padding:6px 12px 7px}
.cnt b{font:500 24px/1 'JetBrains Mono',monospace;color:var(--blue2)}
.cnt span{color:#C8C8C8}
.cnt button{border:0;background:none;color:var(--mut);margin-left:6px}
.insp{right:12px;bottom:12px;width:250px;background:rgba(36,36,36,.97);border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;font-size:12.5px}
.insp h4{margin:0 0 2px;font-size:13.5px}
.insp .row{display:flex;justify-content:space-between;padding:2px 0;color:#CFCFCF}
.insp .row b{font-family:'JetBrains Mono',monospace;font-weight:500}
.insp .x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--mut)}
.vban{left:50%;transform:translateX(-50%);bottom:14px;max-width:min(560px,90%);background:#2A2A2A;border:1px solid var(--org);border-radius:9px;padding:10px 12px;color:#DDD;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vban span{flex:1 1 260px}
/* drawing classes */
.pg{fill:#262626}
.pgb{fill:none;stroke:#444;stroke-width:1}
.we{fill:none;stroke:#D2D2D2;stroke-width:6;stroke-linejoin:miter}
.wi{fill:none;stroke:#C9C9C9;stroke-width:2.6}
.wgap{fill:#262626}
.dl{stroke:#B5B5B5;stroke-width:1.2;fill:none}
.da{stroke:#7A7A7A;stroke-width:.8;fill:none;stroke-dasharray:3 3}
.wl{stroke:#BFBFBF;stroke-width:1;fill:none}
.fx{fill:none;stroke:#A8A8A8;stroke-width:1}
.rn{fill:#BDBDBD;font:700 11px Arial,sans-serif;text-anchor:middle;letter-spacing:.04em}
.ra{fill:#8C8C8C;font:10px Arial,sans-serif;text-anchor:middle}
.ru{fill:#7FA0D8;font:600 10px Arial,sans-serif;text-anchor:middle}
.dim{stroke:#666;stroke-width:.8}
.dt{fill:#8A8A8A;font:10px Arial,sans-serif;text-anchor:middle}
.tt{fill:#C8C8C8;font:700 15px Arial,sans-serif}
.ts{fill:#8C8C8C;font:10px Arial,sans-serif}
.gw{stroke:var(--blue);stroke-width:2;fill:none}
.gr{fill:rgba(91,149,255,.10);stroke:var(--blue);stroke-width:1.2}
.gi{fill:none;stroke:var(--blue2);stroke-width:1.4}
/* overlays */
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(91,149,255,.07)}
.hit.on{fill:rgba(91,149,255,.16);stroke:var(--blue);stroke-width:2.4}
.evr{fill:rgba(91,149,255,.18);stroke:var(--blue);stroke-width:2}
.evr.f{fill:rgba(232,163,61,.18);stroke:var(--org)}
.evb{fill:rgba(91,149,255,.12);stroke:var(--blue);stroke-width:2}
.evb.f{fill:rgba(232,163,61,.08);stroke:var(--org)}
.evp{fill:#3A74E8}.evp.f{fill:#C2862A}
.evt{fill:#fff;font:700 11px Inter,sans-serif;text-anchor:middle}
.evb.cur,.evr.cur{stroke:#fff;stroke-width:3}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#262626;border:1px solid var(--bd2);border-radius:12px;padding:18px 20px}
.mbox h2{margin:0 0 4px;font-size:16px}
.mbox .sub{color:var(--mut);margin:0 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd2);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:#4A6FB0;background:#22304A}
.opt input{margin-top:3px}
.opt b{display:block}
.opt span{color:var(--mut);font-size:12.5px}
.fld{width:100%;height:32px;border:1px solid var(--bd2);background:var(--fld);border-radius:6px;padding:0 9px}
.mrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
details.ct{margin-top:10px}
details.ct summary{cursor:pointer;color:var(--blue2)}
details.ct pre{font:11.5px/1.5 'JetBrains Mono',monospace;background:#1E1E1E;border-radius:7px;padding:10px;overflow:auto;color:#BFD0EE}
.ul{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ulr{display:grid;grid-template-columns:minmax(0,1fr) 130px 70px;gap:8px;align-items:center;background:#2C2C2C;border-radius:7px;padding:7px 9px}
.ulr .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ulr .fn small{display:block;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;border:1px solid #484848;border-radius:8px;padding:8px 14px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4)}

.status{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--hdr);border-top:1px solid var(--bd);font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden}

@media (max-width:1100px){.body{grid-template-columns:200px minmax(0,1fr) 320px}}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .body{grid-template-columns:1fr;grid-auto-rows:auto}
  #menu{display:inline-flex}
  .rail{display:none;max-height:50vh}
  .rail.open{display:block}
  .main{height:62vh}
  .side{height:70vh}
  .two{grid-template-columns:1fr}
  .crumbs{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <button class="hb" id="menu" aria-label="Project menu">☰</button>
    <span class="logo">Blueline<i></i></span>

<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* =====================================================================
   0. Helpers
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>(Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const fi1=n=>(Math.round(n*10)/10).toFixed(1).replace('.',',');
const eur=n=>'€'+n.toFixed(4);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600);}
let DLNS;try{window.claude?.use?.('downloads').then(n=>DLNS=n).catch(()=>{});}catch(e){}
async function download(name,text,type){if(DLNS){try{await DLNS.save({filename:name,data:text});return;}catch(e){toast('Download was not saved.');return;}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* =====================================================================
   1. Room vocabulary (Finnish plan codes give the room type)
   ===================================================================== */
const RT={
  Living:{fi:'OH',en:'Living room',pl:'living rooms'},Bedroom:{fi:'MH',en:'Bedroom',pl:'bedrooms'},Kitchen:{fi:'K',en:'Kitchen',pl:'kitchens'},
  Bathroom:{fi:'KH',en:'Bathroom',pl:'bathrooms'},Sauna:{fi:'S',en:'Sauna',pl:'saunas'},Hall:{fi:'ET',en:'Hall',pl:'halls'},
  Corridor:{fi:'KÄYTÄVÄ',en:'Corridor',pl:'corridors'},Stair:{fi:'PORRAS',en:'Stair',pl:'stairs'},Lift:{fi:'HISSI',en:'Lift',pl:'lifts'},
  Storage:{fi:'VAR',en:'Storage',pl:'storage rooms'},Technical:{fi:'TEKN',en:'Technical room',pl:'technical rooms'},Utility:{fi:'PKH',en:'Laundry',pl:'laundries'},
  Lobby:{fi:'TK',en:'Lobby',pl:'lobbies'},WC:{fi:'WC',en:'WC',pl:'WCs'},Office:{fi:'TSTO',en:'Office',pl:'offices'},
  Meeting:{fi:'NEUV',en:'Meeting room',pl:'meeting rooms'},OpenOffice:{fi:'AVOTSTO',en:'Open office',pl:'open offices'},
  Bike:{fi:'PVH',en:'Bike storage',pl:'bike storages'},Wash:{fi:'PH',en:'Wash room',pl:'wash rooms'},Room:{fi:'H',en:'Room',pl:'rooms'}
};
const KIND={door:['door','doors'],window:['window','windows'],toilet:['toilet','toilets'],sink:['sink','sinks'],kitchen_sink:['kitchen sink','kitchen sinks'],shower:['shower','showers'],sauna_stove:['sauna stove','sauna stoves']};

/* =====================================================================
   2. Sample generator. Builds a floor in metres, then exports it in the
      Blueline contract (page pixels). This stands in for real sheets;
      the reader layer below does not care where a schema came from.
   ===================================================================== */
const PPM=40,OX=110,OY=150,PW=1400,PH=900; // 40 px per metre on the page image
const X=m=>OX+m*PPM, Y=m=>OY+m*PPM;
const DW=0.85;
const WINDOWED=new Set(['Living','Bedroom','Kitchen','Office','OpenOffice','Meeting','Lobby','Utility']);

function genFloor(o){
  const R=rng(o.seed),rooms=[],items=[];let rn=0,dn=0,wn=0,fn=0;
  const room=(type,x0,y0,x1,y1,unit)=>{const r={id:'R'+(++rn),type,unit:unit||null,m:[x0,y0,x1,y1]};rooms.push(r);return r;};
  const conf=()=>R()<0.014?+(0.56+R()*0.2).toFixed(2):+(0.9+R()*0.09).toFixed(2);
  const door=(or,x,y,s,a,b)=>items.push({id:'D'+(++dn),kind:'door',roomIds:[a&&a.id,b&&b.id].filter(Boolean),conf:conf(),g:{or,x,y,s,w:DW}});
  const win=(or,x,y,w,r)=>items.push({id:'W'+(++wn),kind:'window',roomIds:[r.id],conf:conf(),g:{or,x,y,w}});
  const fix=(kind,x0,y0,x1,y1,r)=>items.push({id:'F'+(++fn),kind,roomIds:[r.id],conf:conf(),g:{x0,y0,x1,y1}});
  const shared=(a,b)=>Math.abs(a.m[2]-b.m[0])<1e-6?a.m[2]:Math.abs(b.m[2]-a.m[0])<1e-6?a.m[0]:null;
  const corr=room('Corridor',0,o.c0,o.W,o.c1);
  const winsOn=(r,ext)=>{const w=r.m[2]-r.m[0],n=r.type==='OpenOffice'?Math.max(2,Math.floor(w/2.6)):w>=3.8?2:1,ww=w>=3?1.2:0.9;for(let k=0;k<n;k++)win('h',r.m[0]+w*(k+.5)/n,ext,ww,r);};
  const fixtures=(r,dir)=>{const[a,b,c,d]=r.m;
    if(r.type==='Bathroom'){fix('toilet',a+.15,b+.15,a+.55,b+.8,r);fix('sink',c-.65,b+.12,c-.15,b+.52,r);fix('shower',c-1.0,d-1.0,c-.15,d-.15,r);}
    else if(r.type==='WC'){fix('toilet',a+.15,b+.15,a+.55,b+.8,r);fix('sink',c-.6,d-.55,c-.15,d-.15,r);}
    else if(r.type==='Sauna'){fix('sauna_stove',a+.15,b+.15,a+.65,b+.65,r);}
    else if(r.type==='Wash'){fix('shower',a+.15,b+.15,a+1.0,b+1.0,r);fix('shower',c-1.0,b+.15,c-.15,b+1.0,r);fix('sink',a+.2,d-.55,a+.7,d-.15,r);}
    else if(r.type==='Utility'){fix('sink',c-.7,b+.15,c-.15,b+.6,r);}
    else if(r.type==='Kitchen'){const yy=dir<0?b+.15:d-.75;fix('kitchen_sink',a+.25,yy,a+1.05,yy+.6,r);}
  };
  const bands=[{bl:o.top,ext:0,cor:o.c0,dir:-1},{bl:o.bottom,ext:o.D,cor:o.c1,dir:1}];
  let ui=0;
  for(const B of bands){
    const y0=Math.min(B.ext,B.cor),y1=Math.max(B.ext,B.cor);
    const fy0=B.dir<0?B.cor-2.6:B.cor, fy1=B.dir<0?B.cor:B.cor+2.6;   // front strip (next to corridor)
    const ry0=B.dir<0?0:B.cor+2.6, ry1=B.dir<0?B.cor-2.6:o.D;          // rear strip (exterior side)
    const line=B.dir<0?fy0:fy1;
    let x=0,prev=null;
    for(const b of B.bl){
      if(b.apt){ // apartment
        const w=b.w,unit=`${o.b} ${o.level}${String(++ui).padStart(2,'0')}`,sauna=w>=6&&R()<.55,mir=R()<.5;
        const fl=[['Hall',w-2.2-(sauna?1.6:0)],['Bathroom',2.2]];if(sauna)fl.push(['Sauna',1.6]);
        const RL={5:[['Living',5]],6:[['Living',3.2],['Bedroom',2.8]],7:[['Living',4],['Bedroom',3]],8:[['Living',3],['Kitchen',2],['Bedroom',3]],9:[['Living',3.2],['Bedroom',2.8],['Bedroom',3]]}[w];
        const place=(list,ya,yb)=>{let cx=x;return list.map(([t,ww])=>{let a=cx,c=cx+ww;cx=c;if(mir){const na=2*x+w-c,nc=2*x+w-a;a=na;c=nc;}return room(t,a,ya,c,yb,unit);});};
        const fr=place(fl,fy0,fy1),rr=place(RL,ry0,ry1),hall=fr[0],kh=fr[1],sa=fr[2];
        door('h',(hall.m[0]+hall.m[2])/2,B.cor,B.dir,hall,corr);
        door('v',shared(hall,kh),(fy0+fy1)/2,kh.m[0]>hall.m[0]?1:-1,hall,kh);
        if(sa)door('v',shared(kh,sa),(fy0+fy1)/2,sa.m[0]>kh.m[0]?1:-1,kh,sa);
        for(const r of rr){
          const oa=Math.max(hall.m[0],r.m[0]),ob=Math.min(hall.m[2],r.m[2]);
          if(ob-oa>=1.0)door('h',(oa+ob)/2,line,B.dir,hall,r);
          else{const nb=rr.filter(q=>q!==r&&shared(q,r)!=null).sort((p,q)=>(q.type==='Living')-(p.type==='Living'))[0];
            if(nb){const sx=shared(nb,r);door('v',sx,(ry0+ry1)/2,r.m[0]>nb.m[0]?1:-1,nb,r);}}
          winsOn(r,B.ext);
          if(r.type==='Living'&&!rr.some(q=>q.type==='Kitchen')){const yy=B.dir<0?r.m[1]+.15:r.m[3]-.75;fix('kitchen_sink',r.m[0]+.25,yy,r.m[0]+1.05,yy+.6,r);}
          fixtures(r,B.dir);
        }
        fr.forEach(r=>fixtures(r,B.dir));
        prev=null;
      }else{ // single room on the corridor
        const r=room(b.t,x,y0,x+b.w,y1);
        if(b.via==='prev'&&prev)door('v',x,(fy0+fy1)/2,1,prev,r);
        else if(!b.nodoor)door('h',x+Math.min(b.w/2,1.2),B.cor,B.dir,r,corr);
        if(b.entry)door('h',x+b.w/2,B.ext,-B.dir,r,null);
        if(WINDOWED.has(b.t)&&b.win!==false)winsOn(r,B.ext);
        fixtures(r,B.dir);
        prev=r;
      }
      x+=b.w;
    }
  }
  const cy=(o.c0+o.c1)/2;
  if(o.ground){door('v',0,cy,1,corr,null);door('v',o.W,cy,-1,corr,null);}
  else{win('v',0,cy,1.0,corr);win('v',o.W,cy,1.0,corr);}
  return exportSchema(o,rooms,items);
}
function exportSchema(o,rooms,items){
  const P=([x,y])=>[Math.round(X(x)*10)/10,Math.round(Y(y)*10)/10];
  const box=it=>{const g=it.g;if(it.kind==='door'){const w=g.w;return g.or==='h'?[X(g.x-w/2),Y(Math.min(g.y,g.y+g.s*w)),X(g.x+w/2),Y(Math.max(g.y,g.y+g.s*w))]:[X(Math.min(g.x,g.x+g.s*w)),Y(g.y-w/2),X(Math.max(g.x,g.x+g.s*w)),Y(g.y+w/2)];}
    if(it.kind==='window')return g.or==='h'?[X(g.x-g.w/2),Y(g.y)-5,X(g.x+g.w/2),Y(g.y)+5]:[X(g.x)-5,Y(g.y-g.w/2),X(g.x)+5,Y(g.y+g.w/2)];
    return[X(g.x0),Y(g.y0),X(g.x1),Y(g.y1)];};
  const ex=new Set(),walls=[];let wn=0;
  const seg=(a,b)=>{const k=[a,b].map(p=>p.join(',')).sort().join('|');if(!ex.has(k)){ex.add(k);walls.push({id:'L'+(++wn),points:[P(a),P(b)]});}};
  rooms.forEach(r=>{const[a,b,c,d]=r.m;seg([a,b],[c,b]);seg([c,b],[c,d]);seg([c,d],[a,d]);seg([a,d],[a,b]);});
  return{
    drawing:{id:o.sid,file:o.file,page:1,imageUrl:null,width:PW,height:PH,metersPerPixel:1/PPM,
      scale:{method:'scale-bar',text:'1:100',box:[OX,PH-78,OX+200,PH-62]},credit:{source:'Blueline synthetic sample',licence:'MIT'}},
    walls,
    items:items.map(it=>({id:it.id,kind:it.kind,box:box(it).map(v=>Math.round(v*10)/10),roomIds:it.roomIds,conf:it.conf,_g:it.g})),
    rooms:rooms.map(r=>{const[a,b,c,d]=r.m,area=(c-a)*(d-b);return{id:r.id,label:RT[r.type].fi,type:r.type,unit:r.unit,
      polygon:[P([a,b]),P([c,b]),P([c,d]),P([a,d])],printedAreaM2:Math.round(area*10)/10,
      labelBox:[X((a+c)/2)-24,Y((b+d)/2)-12,X((a+c)/2)+24,Y((b+d)/2)+12],conf:1};}),
    texts:[],
    meta:{source:'sample',version:'gen-1',msRead:0,costEUR:0},
    _t:{title:o.title,code:o.code,W:o.W,D:o.D,project:o.project}
  };
}

/* =====================================================================
   3. The sample project: Building A (8 floors, housing) + Building B (3 floors, offices)
   ===================================================================== */
const PROJECT={name:'Koivukaari block',place:'Espoo (sample project)',buildings:[]};
const SH={};          // sheet id -> sheet
const TRUTH={};       // sheet id -> deep copy of the generated schema (answer key source)
const LVL=n=>`Floor ${n}`;

function samplePlans(){
  const A={id:'A',name:'Building A',kind:'Housing',sheets:[]},B={id:'B',name:'Building B',kind:'Offices',sheets:[]};
  const top12=[[6,6],[7,5],[5,7]],bot28=[[7,7,7,7],[9,5,7,7],[7,7,5,9],[8,6,6,8],[9,6,6,7],[6,8,8,6],[5,9,9,5]];
  const apts=a=>a.map(w=>({apt:1,w}));
  for(let L=1;L<=8;L++){
    const R=rng(1000+L*37);let top,bottom;
    if(L===1){top=[{t:'Lobby',w:5,entry:1},{t:'Bike',w:7,entry:1},{t:'Stair',w:2.5},{t:'Lift',w:1.5,nodoor:1},{t:'Utility',w:4},{t:'Wash',w:2.6},{t:'Sauna',w:2.2,via:'prev'},{t:'Storage',w:3.2}];
      bottom=[{t:'Technical',w:5},{t:'Storage',w:9},...apts([7,7])];}
    else{const grp=L<=4?0:L<=7?1:2,pick=a=>a[Math.floor(R()*a.length)];
      const t1=grp===2?[12]:pick(top12),t2=grp===2?[7,5]:pick(top12);
      top=[...apts(t1.length===1?[6,6]:t1),{t:'Stair',w:2.5},{t:'Lift',w:1.5,nodoor:1},...apts(t2)];
      bottom=apts(grp===2?[9,9,5,5]:pick(bot28));}
    const sid=`A-${L}01`;
    add(A,sid,L,genFloor({sid,code:sid,b:'A',level:L,W:28,D:15,c0:6.5,c1:8.5,top,bottom,seed:500+L*13,ground:L===1,file:`A_krs${L}_pohja.png`,title:`Building A, ${LVL(L).toLowerCase()} plan`,project:PROJECT.name}));
  }
  const offTop=[[{t:'Lobby',w:6,entry:1},{t:'OpenOffice',w:10},{t:'Meeting',w:4},{t:'Meeting',w:4}],
    [{t:'Office',w:4},{t:'Office',w:4},{t:'OpenOffice',w:8},{t:'Office',w:4},{t:'Office',w:4}],
    [{t:'OpenOffice',w:12},{t:'Office',w:4},{t:'Office',w:4},{t:'Meeting',w:4}]];
  const offBot=[[{t:'WC',w:1.8},{t:'WC',w:1.8},{t:'WC',w:1.8},{t:'Technical',w:3.6},{t:'Stair',w:2.6},{t:'Lift',w:1.6,nodoor:1},{t:'Kitchen',w:5},{t:'Storage',w:5.8}],
    [{t:'WC',w:1.8},{t:'WC',w:1.8},{t:'Meeting',w:5.8},{t:'Stair',w:2.6},{t:'Lift',w:1.6,nodoor:1},{t:'Kitchen',w:4.4},{t:'Storage',w:2.2},{t:'Meeting',w:3.8}]];
  for(let L=1;L<=3;L++){const sid=`B-${L}01`;
    add(B,sid,L,genFloor({sid,code:sid,b:'B',level:L,W:24,D:14,c0:6,c1:8,top:offTop[L-1],bottom:offBot[L===1?0:1],seed:900+L*7,ground:L===1,file:`B_krs${L}_pohja.png`,title:`Building B, ${LVL(L).toLowerCase()} plan`,project:PROJECT.name}));}
  PROJECT.buildings.push(A,B);
  function add(bld,sid,level,schema){TRUTH[sid]=JSON.parse(JSON.stringify(schema));
    SH[sid]={id:sid,bId:bld.id,level,code:sid,file:schema.drawing.file,status:'queued',src:'sample',sample:schema,schema:null,imageUrl:null,schemaJson:null,file0:null,err:null,readBy:null,cost:0,ms:0};
    bld.sheets.push(sid);}
}

/* =====================================================================
   4. READERS. This is the swap point.
      A reader takes one sheet and returns a BluelineSchema (see README).
      - DemoReader: knows the sample sheets, and accepts any image that comes
        with its own schema.json (e.g. an offline run of the real solver).
      - ApiReader: POSTs the file to {endpoint}/analyze and expects the same
        schema back. Point it at the real model when it exists; nothing else
        in this file changes.
   ===================================================================== */
const CFG={reader:store.get('bl_reader','demo'),endpoint:store.get('bl_endpoint','http://localhost:8000'),sendSamples:store.get('bl_sendSamples',true)};
class ReaderError extends Error{constructor(code,msg){super(msg);this.code=code;}}
const DemoReader={id:'demo',label:'Demo',
  async read(sh){
    if(sh.schemaJson){await sleep(200);return{schema:sh.schemaJson,costEUR:0};}
    if(sh.sample){await sleep(180+Math.random()*320);return{schema:JSON.parse(JSON.stringify(sh.sample)),costEUR:0.0004};}
    throw new ReaderError('needs_model','The demo reader only knows the sample sheets. Connect the Blueline API, or upload a schema.json with the same file name.');
  }};
const ApiReader={id:'api',label:'Blueline API',
  async read(sh){
    let blob=sh.file0,name=sh.file;
    if(!blob&&sh.sample){if(!CFG.sendSamples)return DemoReader.read(sh);blob=await sheetToPng(sh);name=sh.file;}
    if(!blob)throw new ReaderError('needs_model','No file to send for this sheet.');
    const fd=new FormData();fd.append('file',blob,name);fd.append('sheet',JSON.stringify({id:sh.id,building:sh.bId,level:sh.level}));
    let res;try{res=await fetch(CFG.endpoint.replace(/\/$/,'')+'/analyze',{method:'POST',body:fd});}
    catch(e){throw new ReaderError('network','Could not reach '+CFG.endpoint+'. Is the API running and does it allow CORS?');}
    if(!res.ok)throw new ReaderError('http','The API answered '+res.status+'.');
    const js=await res.json();return{schema:js.schema||js,costEUR:+(js.meta?.costEUR??js.costEUR??0)};
  }};
const READERS={demo:DemoReader,api:ApiReader};
const reader=()=>READERS[CFG.reader]||DemoReader;

function validateSchema(s){
  const e=[];if(!s||typeof s!=='object')return['not an object'];
  const d=s.drawing;if(!d||!(d.width>0)||!(d.height>0))e.push('drawing.width/height missing');
  if(!Array.isArray(s.rooms))e.push('rooms[] missing');if(!Array.isArray(s.items))e.push('items[] missing');
  (s.rooms||[]).forEach((r,i)=>{if(!Array.isArray(r.polygon)||r.polygon.length<3)e.push(`rooms[${i}].polygon`);r.type=r.type||'Room';if(!RT[r.type])r.type='Room';r.id=r.id||'R'+(i+1);if(r.conf==null)r.conf=1;});
  (s.items||[]).forEach((it,i)=>{if(!Array.isArray(it.box)||it.box.length!==4)e.push(`items[${i}].box`);it.id=it.id||'I'+(i+1);it.roomIds=it.roomIds||[];if(it.conf==null)it.conf=1;});
  s.walls=s.walls||[];s.texts=s.texts||[];s.meta=s.meta||{};
  return e;
}
async function readSheet(sh){
  sh.status='reading';sh.err=null;refreshLight();
  const t0=performance.now(),rd=reader();
  try{const{schema,costEUR}=await rd.read(sh);const errs=validateSchema(schema);
    if(errs.length)throw new ReaderError('invalid','Schema did not match the contract: '+errs.slice(0,3).join(', '));
    sh.schema=schema;sh.status='read';sh.readBy=rd.label;sh.cost=costEUR||0;sh.ms=Math.round(performance.now()-t0);
    if(sh.imageUrl)schema.drawing.imageUrl=sh.imageUrl;
    putDef(sh);
  }catch(e){sh.status=e.code==='needs_model'?'needs_model':'error';sh.err=e.message;putDef(sh);}
  refreshLight();
}
let reading=0;
async function readAll(list){
  const q=(list||Object.values(SH)).filter(s=>s.status!=='reading');q.forEach(s=>{s.status='queued';});refreshLight();
  reading++;const worker=async()=>{while(q.length){await readSheet(q.shift());}};
  await Promise.all([worker(),worker()]);reading--;refreshAll();
}
async function sheetToPng(sh){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}"><style>${SHEET_CSS}</style>${drawSample(sh.sample)}</svg>`;
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();
  const c=document.createElement('canvas');c.width=PW;c.height=PH;c.getContext('2d').drawImage(img,0,0);
  return new Promise(r=>c.toBlob(r,'image/png'));
}

  const T=P.t,filt=T.items?`kind∈{${T.items.join(',')}}`:T.units?`distinct(unit)${P.withSauna?' having type=Sauna':''}`:T.allRooms?'rooms (not corridor/lift)':`type∈{${T.rooms.join(',')}}`;
  const mpp=read[0]?.schema.drawing.metersPerPixel;
  if(isArea){
    const pr=ok.flatMap(p=>p.extra?.printed||[]),bad=pr.filter(([c,p])=>Math.abs(c-p)/p>0.02);
    A.cross={n:pr.length,bad:bad.length};
    A.calc=`Σ shoelace(${P.kind==='unitArea'?'rooms of each apartment':filt}) × (${mpp?mpp.toFixed(4):'?'} m/px)²\n= ${f1(A.value)} m² over ${ok.length} sheet${ok.length>1?'s':''}\ncheck: ${pr.length} printed areas, ${pr.length-bad.length} within 2%`;
  }else A.calc=A.kind==='rank'?`count(${filt}) per sheet\n= ${ok.map(p=>p.val).join(', ')}\n${P.least?'min':'max'} = ${A.value}`:`count(${filt})${ok.length>1?' summed over '+ok.length+' sheets':''} = ${A.value}`;
  A.verified=!missing.length&&!A.flags&&(!isArea||(A.cross.n>0&&!A.cross.bad));
  A.ms=performance.now()-t0;A.readCost=read.reduce((a,s)=>a+s.cost,0);
  return A;
}

const BENCH={sid:'A-301',ran:false,loaded:false,qs:null};
function benchQs(){ // key comes from the generated geometry (TRUTH), independent of the answer engine
  const T=TRUTH[BENCH.sid];if(!T)return[];const m=r=>{const p=r.polygon;return((p[1][0]-p[0][0])/PPM)*((p[2][1]-p[1][1])/PPM);};
  const cnt=k=>T.items.filter(i=>i.kind===k).length,rt=t=>T.rooms.filter(r=>r.type===t),units=[...new Set(T.rooms.filter(r=>r.unit).map(r=>r.unit))];

    {q:'What is the area of the largest room?',fi:'Mikä on suurimman huoneen pinta-ala?',key:+Math.max(...T.rooms.filter(r=>r.type!=='Corridor'&&r.type!=='Lift').map(m)).toFixed(2),type:'area'},
    {q:'What is the ceiling height?',fi:'Mikä on huonekorkeus?',key:2.6,type:'length'}
  ];
}
function benchRun(){

  return qs.map(x=>{const t0=performance.now(),A=answer(x.q,{type:'floor',id:BENCH.sid}),ms=performance.now()-t0;
    let res;if(A.kind==='nope')res='abstain';else{const v=A.value;res=x.type==='count'?(v===x.key?'match':'miss'):(Math.abs(v-x.key)/Math.abs(x.key)<=0.02?'match':'miss');}

}
function viewBench(){
  const sh=SH[BENCH.sid];
  let h=`<div class="view"><div class="vh"><div><h1>Accuracy check · one blueprint</h1><p>Stoa scores accuracy on a single blueprint: counts must be exact, areas within 2%. Sheet ${BENCH.sid} (${esc(bName(sh.bId))}, ${LVL(sh.level).toLowerCase()}).</p></div><span class="sp"></span>
    <button class="btn" data-act="loadkey">Load Stoa key (JSON)</button><button class="btn pri" data-act="runbench">${BENCH.ran?'Run again':'Run check'}</button></div>`;
  if(!BENCH.ran){return h+`<div class="note"><b>Sample key.</b> The answer key here is generated with the drawing, so it shows the flow, not a real score. Load Stoa's answers (a JSON list of {"question","answer"}) to score a real sheet once the model reads it.</div><div class="card" style="padding:0"><svg viewBox="0 0 ${PW} ${PH}" style="width:100%;display:block"><use href="#sd-${BENCH.sid}"/></svg></div></div>`;}
  const rows=benchRun(),ans=rows.filter(r=>r.res!=='abstain'),ok=rows.filter(r=>r.res==='match').length;
  h+=`<div class="tiles"><div class="tile bl"><b>${ok}/${ans.length}</b><span>correct when answering</span></div><div class="tile"><b>${rows.length-ans.length}</b><span>said “can't verify”</span></div><div class="tile"><b>${eur(sh.cost)}</b><span>read once${CFG.reader==='demo'?' (est.)':''}</span></div><div class="tile"><b>€0.0000</b><span>per extra question (code)</span></div></div>
   <div class="card" style="padding:0;overflow:auto"><table class="tk"><thead><tr><th>Question</th><th>Blueline</th><th>Key</th><th>Result</th><th>Time</th><th></th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{const v=r.A.kind==='nope'?'can\'t verify':r.type==='count'?r.A.value:f1(r.A.value)+' m²';
    h+=`<tr><td>${esc(r.q)}${r.fi?`<div class="asc">${esc(r.fi)}</div>`:''}</td><td>${v}</td><td>${r.type==='count'?r.key:r.key+(r.type==='area'?' m²':' m')}</td>
     <td class="${r.res==='match'?'match':r.res==='miss'?'miss':'abst'}">${r.res==='match'?'✓ match':r.res==='miss'?'✗ miss':'abstained'}</td><td>${r.ms.toFixed(1)} ms</td>
     <td>${r.A.kind!=='nope'?`<button class="btn sm" data-act="benchshow" data-i="${i}">Show proof</button>`:''}</td></tr>`;});
  return h+`</tbody></table></div><div class="note">${BENCH.loaded?'<b>Key loaded from file.</b>':'<b>Sample key</b> generated with the drawing.'} Saying “can't verify” is deliberate: no proof, no answer.</div></div>`;
}

function vbOf(){return ST.vb[ST.sid];}
function fitView(){const sh=SH[ST.sid],[w,h]=sheetDims(sh),el=$('#vpw');const cw=el?.clientWidth||900,ch=el?.clientHeight||600;
  let bx=[0,0,w,h];if(sh.schema?._t){const t=sh.schema._t;bx=[X(0)-70,Y(0)-70,X(t.W)+70,Y(t.D)+60];}
  const bw=bx[2]-bx[0],bh=bx[3]-bx[1],sc=Math.max(bw/cw,bh/ch);ST.vb[sh.id]={x:bx[0]-(cw*sc-bw)/2,y:bx[1]-(ch*sc-bh)/2,w:cw*sc,h:ch*sc};applyVB();}
function applyVB(){const v=vbOf(),el=$('#vpw');if(!v||!el)return;v.h=v.w*(el.clientHeight||600)/(el.clientWidth||900);$('#vsvg').setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);}
function zoomAt(f,cx,cy){const v=vbOf(),el=$('#vpw'),r=el.getBoundingClientRect();if(cx==null){cx=r.width/2;cy=r.height/2;}
  const px=v.x+cx/r.width*v.w,py=v.y+cy/r.height*v.h,nw=Math.min(6000,Math.max(120,v.w*f));v.x=px-(px-v.x)*nw/v.w;v.y=py-(py-v.y)*nw/v.w;v.w=nw;applyVB();drawFloorOverlay();}
function zoomToBox(b){const el=$('#vpw'),pad=160,bw=b[2]-b[0]+pad*2,bh=b[3]-b[1]+pad*2,cw=el.clientWidth,ch=el.clientHeight,s=Math.max(bw/cw,bh/ch);
  ST.vb[ST.sid]={x:(b[0]+b[2])/2-cw*s/2,y:(b[1]+b[3])/2-ch*s/2,w:cw*s,h:ch*s};applyVB();drawFloorOverlay();}
function bindViewer(){
  const el=$('#vpw');let drag=null,moved=false;
  el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomAt(e.deltaY>0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  el.addEventListener('pointerdown',e=>{if(e.target.closest('.ovl'))return;drag={x:e.clientX,y:e.clientY,v:{...vbOf()}};moved=false;el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3){moved=true;el.classList.add('drag');}
    const v=vbOf(),k=v.w/el.clientWidth;v.x=drag.v.x-dx*k;v.y=drag.v.y-dy*k;applyVB();});
  el.addEventListener('pointerup',e=>{el.classList.remove('drag');const wasDrag=moved;drag=null;
    if(!wasDrag){const t=document.elementFromPoint(e.clientX,e.clientY),rm=t?.closest('[data-room]');ST.sel=rm?(ST.sel===rm.dataset.room?null:rm.dataset.room):null;drawFloorOverlay();renderInspect();}});
  $('#zi').onclick=()=>zoomAt(1/1.3);$('#zo').onclick=()=>zoomAt(1.3);$('#fit').onclick=()=>{fitView();drawFloorOverlay();};
  $('#lay').onclick=()=>{ST.overlay=!ST.overlay;drawFloorOverlay();};
}
new ResizeObserver(()=>{if(ST.view==='floor'&&$('#vpw')){applyVB();drawFloorOverlay();}}).observe(document.querySelector('.main'));

const ANS={};
function ansHTML(A){
  const sn=scopeName(A.scope);
  if(A.kind==='nope')return`<div class="big"><span class="pill no">Can't verify</span></div><div class="atext">${esc(A.text)}</div><div class="asc">${esc(sn)}</div>`;
  const isA=A.unit==='m²',val=isA?f1(A.value):A.value;
  const badge=A.verified?`<span class="pill ok">Verified</span>`:A.missing.length?`<span class="pill chk">${A.missing.length} sheet${A.missing.length>1?'s':''} not read</span>`:A.flags?`<span class="pill chk">${A.flags} to check</span>`:isA&&A.cross?.bad?`<span class="pill chk">${A.cross.bad} areas off printed</span>`:`<span class="pill chk">Unchecked</span>`;
  let h=`<div class="big"><b>${val}</b><span class="u">${isA?'m²':esc(nounOf(A.P,A.value))}</span>${badge}</div>`;
  if(A.text)h+=`<div class="atext">${esc(A.text)}</div>`;
  h+=`<div class="asc">${esc(sn)}</div>`;
  if(A.per.length>1){const mx=Math.max(1,...A.per.filter(p=>!p.na).map(p=>p.val||0));
    h+=`<div class="bars">${A.per.map(p=>{const sh=SH[p.sid],lbl=(A.scope.type==='project'?sh.bId+' · ':'')+LVL(sh.level);
      if(p.na)return`<button class="bar na" data-go="floor" data-s="${p.sid}"><span>${lbl}</span><span>${sh.status==='needs_model'?'needs model':'not read'}</span><span>·</span></button>`;
      return`<button class="bar ${p.sid===A.top?'cur':''}" data-ans="${A.n}" data-s="${p.sid}"><span>${lbl}</span><span><i class="${p.flags?'f':''}" style="width:${(p.val||0)/mx*100}%"></i></span><span>${isA?Math.round(p.val):p.val}</span></button>`;}).join('')}</div>`;}
  else if(A.per[0]&&!A.per[0].na&&A.per[0].ev.length&&A.per[0].ev[0].type==='item'){
    h+=`<div class="evs">${A.per[0].ev.slice(0,60).map((e,i)=>`<button class="ev ${e.flag?'f':''}" data-ans="${A.n}" data-s="${A.per[0].sid}" data-ev="${e.id}" title="${e.id}">${i+1}</button>`).join('')}</div>`;}
  h+=`<div class="calc">${esc(A.calc)}</div><div class="afoot"><span>answer <b>€0.0000</b> (code, ${A.ms.toFixed(1)} ms)</span><span>reading these sheets <b>${eur(A.readCost)}</b>${CFG.reader==='demo'?' est.':''}, once</span></div>
   <button class="alink" data-act="show" data-ans="${A.n}">Show on drawings →</button>`;
  return h;
}
function activate(n,auto){
  const A=ANS[n];if(!A)return;ST.active=A;$$('.ans').forEach(e=>e.classList.toggle('act',+e.dataset.n===n));
  if(A.scope.type==='floor'){if(ST.view!=='floor'||ST.sid!==A.scope.id){go('floor',{sid:A.scope.id,keep:1});return;}}
  else if(!auto||ST.view==='project'||ST.view==='takeoff'||ST.view==='review'||ST.view==='bench'){
    if(A.scope.type==='building'&&!(ST.view==='floor'&&SH[ST.sid].bId===A.scope.id)){go('building',{bId:A.scope.id,keep:1});return;}
    if(A.scope.type==='project'&&auto&&ST.view!=='project'&&ST.view!=='building'&&ST.view!=='floor'){go('project',{keep:1});return;}}
  renderRail();renderMain();
}
function clearActive(){ST.active=null;$$('.ans').forEach(e=>e.classList.remove('act'));renderRail();renderMain();}

let PENDING=[],ADDTO=null;
function guess(name){const n=name.toLowerCase();let lv=null,b=null;
  let m=n.match(/(?:krs|kerros|floor|level|lvl|fl|storey)[ _-]?(\d{1,2})/)||n.match(/(?:^|[^a-z0-9])k(\d{1,2})(?:[^0-9]|$)/)||n.match(/(\d{1,2})(?:st|nd|rd|th)?[ _-]?(?:floor|krs|kerros)/);if(m)lv=+m[1];
  else{m=n.match(/(\d{1,2})(?!.*\d)/);if(m)lv=+m[1];}
  m=n.match(/^([a-z])[ _-]/)||n.match(/(?:building|talo|bldg|rak)[ _-]?([a-z])\b/);if(m){const id=m[1].toUpperCase();if(PROJECT.buildings.some(x=>x.id===id))b=id;}
  return{lv,b};}
function uploadModal(files){
  const imgs=files.filter(f=>/^image\//.test(f.type)),jsons=files.filter(f=>/\.json$/i.test(f.name)),base=n=>n.replace(/\.[^.]+$/,'').toLowerCase();
  PENDING=imgs.map(f=>{const g=guess(f.name),j=jsons.find(x=>base(x.name)===base(f.name));return{file:f,json:j||null,b:ADDTO||g.b||ST.bId,lv:g.lv};});
  jsons.filter(j=>!imgs.some(f=>base(f.name)===base(j.name))).forEach(j=>{const g=guess(j.name);PENDING.push({file:null,json:j,b:ADDTO||g.b||ST.bId,lv:g.lv});});
  if(!PENDING.length){toast('Upload PNG or JPG sheets (optionally with a matching schema.json).');return;}
  const opts=b=>PROJECT.buildings.map(x=>`<option value="${x.id}" ${x.id===b?'selected':''}>${esc(x.name)}</option>`).join('')+`<option value="__new">New building…</option>`;
  modal(`<h2>Add ${PENDING.length} sheet${PENDING.length>1?'s':''}</h2><p class="sub">Check which building and floor each sheet belongs to. Floors were guessed from the file names.</p>
   <div class="ul">${PENDING.map((p,i)=>`<div class="ulr"><div class="fn">${esc((p.file||p.json).name)}<small>${p.json&&p.file?'+ '+esc(p.json.name)+' (used as reader output)':p.json?'schema only':'image'}</small></div>
     <select class="sel" data-pi="${i}" data-k="b">${opts(p.b)}</select><input class="fld" style="height:28px" type="number" min="0" max="99" value="${p.lv??''}" placeholder="Floor" data-pi="${i}" data-k="lv"></div>`).join('')}</div>
   <div class="note">Reader now: <b>${esc(reader().label)}</b>. ${CFG.reader==='demo'?'Sheets without a schema.json will wait for the Blueline model.':'Sheets are sent to '+esc(CFG.endpoint)+'/analyze.'}</div>
   <div class="mact"><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="addgo">Add and read</button></div>`);
  $('#addgo').onclick=async()=>{
    $$('#mbox [data-pi]').forEach(el=>{const p=PENDING[+el.dataset.pi];if(el.dataset.k==='b')p.b=el.value;else p.lv=el.value===''?null:+el.value;});
    const added=[];
    for(const p of PENDING){let bid=p.b;if(bid==='__new')bid=newBuilding().id;const b=PROJECT.buildings.find(x=>x.id===bid);
      let lv=p.lv??(Math.max(0,...b.sheets.map(i=>SH[i].level))+1);
      const name=(p.file||p.json).name;let sid=`${b.id}-${lv}01`;
      if(SH[sid]){const old=SH[sid];b.sheets=b.sheets.filter(i=>i!==sid);delete SH[sid];document.getElementById('sd-'+sid)?.remove();if(old.imageUrl)URL.revokeObjectURL(old.imageUrl);}
      const sh={id:sid,bId:b.id,level:lv,code:sid,file:name,status:'queued',src:'upload',sample:null,schema:null,imageUrl:null,schemaJson:null,file0:p.file,err:null,readBy:null,cost:0,ms:0};
      if(p.file){sh.imageUrl=URL.createObjectURL(p.file);try{const im=new Image();im.src=sh.imageUrl;await im.decode();sh.imgW=im.naturalWidth;sh.imgH=im.naturalHeight;}catch(e){}}
      if(p.json){try{sh.schemaJson=JSON.parse(await p.json.text());}catch(e){sh.status='error';sh.err='schema.json is not valid JSON';}}
      SH[sid]=sh;b.sheets.push(sid);putDef(sh);added.push(sh);}
    closeModal();ADDTO=null;go('floor',{sid:added[0].id});readAll(added.filter(s=>s.status!=='error'));};
}
function newBuilding(name){const used=new Set(PROJECT.buildings.map(b=>b.id));let c='C';while(used.has(c))c=String.fromCharCode(c.charCodeAt(0)+1);
  const b={id:c,name:name||`Building ${c}`,kind:'Uploaded',sheets:[]};PROJECT.buildings.push(b);return b;}
function addBuildingModal(){modal(`<h2>Add building</h2><p class="sub">Then upload its floor sheets (up to as many floors as it has).</p><input class="fld" id="bn" placeholder="Building name" value="Building ${String.fromCharCode(65+PROJECT.buildings.length)}">
  <div class="mact"><button class="btn" data-act="close">Cancel</button><button class="btn pri" id="bgo">Add and upload sheets</button></div>`);
  $('#bgo').onclick=()=>{const b=newBuilding($('#bn').value.trim()||undefined);closeModal();ADDTO=b.id;renderAll();$('#file').click();};}
function helpModal(){modal(`<h2>How Blueline works</h2><p class="sub">Read each sheet once, then answer any number of questions in code, with proof.</p>
  <ol style="padding-left:18px;line-height:1.7;color:#D6D6D6;margin:0">
   <li><b>Upload a project.</b> Several buildings, one sheet per floor (8 floors is fine). Floors are guessed from file names.</li>
   <li><b>Read once.</b> The reader turns each sheet into schema.json: rooms, doors, windows, fixtures, scale. The reader is swappable (header button).</li>
   <li><b>Ask at any level.</b> Floor, building or whole project, in English or Finnish. Answers are computed from the schemas, so extra questions cost nothing.</li>
   <li><b>Check the proof.</b> Every counted item is numbered on its floor. Per-floor bars jump to the sheet. Areas show the calculation and a cross-check against printed areas.</li>
   <li><b>Review and export.</b> Unsure items go to the review queue. Quantities export as CSV, schemas as JSON.</li></ol>
  <div class="note"><b>Today:</b> the demo reader uses generated sample sheets, so numbers are exact by construction. When the model is ready, choose “Blueline API” and point it at the endpoint. Nothing else changes.</div>
  <div class="mact"><button class="btn pri" data-act="close">Got it</button></div>`);}

/* =====================================================================
   10. Events
   ===================================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-q],[data-ans]');if(!t)return;
  if(t.closest('#vpw')&&t.tagName==='rect')return;
  if(t.dataset.q){ask(t.dataset.q);return;}
  if(t.dataset.go){e.preventDefault();const g=t.dataset.go;if(g==='floor')go('floor',{sid:t.dataset.s});else if(g==='building')go('building',{bId:t.dataset.b||ST.bId});else go(g);return;}
  const a=t.dataset.act;
  if(t.dataset.ans&&!a){const A=ANS[t.dataset.ans];ST.active=A;$$('.ans').forEach(x=>x.classList.toggle('act',+x.dataset.n===A.n));
    go('floor',{sid:t.dataset.s,keep:1});
    if(t.dataset.ev){const it=SH[t.dataset.s].schema.items.find(i=>i.id===t.dataset.ev);if(it)setTimeout(()=>zoomToBox(it.box),30);}return;}
  if(a==='show'){activate(+t.dataset.ans,false);return;}
  if(a==='clearans')clearActive();
  else if(a==='reader')readerModal();
  else if(a==='readall')readAll();
  else if(a==='close')closeModal();
  else if(a==='addb')addBuildingModal();
  else if(a==='addfloor'){ADDTO=t.dataset.b;$('#file').click();}
  else if(a==='desel'){ST.sel=null;drawFloorOverlay();renderInspect();}
  else if(a==='reread')readAll([SH[t.dataset.s]]);
  else if(a==='csv')exportCSV();
  else if(a==='json')download(`blueline-schemas-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(Object.values(SH).filter(s=>s.schema).map(s=>({sheet:s.id,building:s.bId,level:s.level,schema:stripPriv(s.schema)})),null,1),'application/json');
  else if(a==='accept'||a==='reject'){const sh=SH[t.dataset.s],it=sh.schema.items.find(i=>i.id===t.dataset.i);if(!it)return;
    if(a==='accept'){it.conf=0.99;it.reviewed='confirmed';}else{sh.schema.items=sh.schema.items.filter(i=>i!==it);}
    rerunAnswers();toast(a==='accept'?'Confirmed. Answers updated.':'Removed. Answers updated.');renderAll();}
  else if(a==='locate'){const sh=SH[t.dataset.s],it=sh.schema.items.find(i=>i.id===t.dataset.i);go('floor',{sid:sh.id});if(it)setTimeout(()=>{zoomToBox(it.box);},30);}
  else if(a==='runbench'){BENCH.ran=true;renderMain();}
  else if(a==='benchshow'){const rows=benchRun(),r=rows[+t.dataset.i];const A=r.A;ANS[A.n]=A;ST.active=A;go('floor',{sid:BENCH.sid});}
  else if(a==='loadkey'){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{const js=JSON.parse(await inp.files[0].text());const list=(Array.isArray(js)?js:js.questions||[]).map(x=>({q:x.question||x.q,fi:x.question_fi||x.fi||'',key:typeof x.answer==='number'?x.answer:parseFloat(String(x.answer).replace(',','.')),type:/area|m2|m²|pinta/i.test(x.question||x.q)?'area':'count'})).filter(x=>x.q&&!isNaN(x.key));
      if(!list.length)throw 0;BENCH.qs=list;BENCH.loaded=true;BENCH.ran=true;renderMain();toast(`Loaded ${list.length} questions.`);}catch(err){toast('Could not read that key. Expected [{"question": "...", "answer": 14}].');}};inp.click();}
});
document.addEventListener('change',e=>{if(e.target.id==='heat'){ST.heat=e.target.value;renderMain();}});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const m=b.dataset.s;ST.scopeMode='manual';
  ST.scope=m==='floor'?{type:'floor',id:ST.sid}:m==='building'?{type:'building',id:ST.sid?SH[ST.sid].bId:ST.bId}:{type:'project'};renderSeg();renderEmptyAsk();
  const ms=$('#msgs');if(!ms.querySelector('.ans'))renderEmptyAsk();});
$('#comp').addEventListener('submit',e=>{e.preventDefault();const q=$('#q');ask(q.value);q.value='';q.style.height='';});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#comp').requestSubmit();}});
$('#q').addEventListener('input',e=>{e.target.style.height='';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';});
$('#rdrBtn').onclick=readerModal;$('#helpBtn').onclick=helpModal;$('#upBtn').onclick=()=>{ADDTO=null;$('#file').click();};
$('#menu').onclick=()=>$('#rail').classList.toggle('open');
$('#file').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)uploadModal(fs);});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return;}
  if(/input|textarea|select/i.test(document.activeElement?.tagName))return;
  if(ST.view==='floor'){const b=PROJECT.buildings.find(x=>x.id===SH[ST.sid].bId),ids=[...b.sheets].sort((x,y)=>SH[x].level-SH[y].level),i=ids.indexOf(ST.sid);
    if((e.key===']'||e.key==='PageUp')&&i<ids.length-1){e.preventDefault();go('floor',{sid:ids[i+1]});}
    if((e.key==='['||e.key==='PageDown')&&i>0){e.preventDefault();go('floor',{sid:ids[i-1]});}
    if(e.key==='f'||e.key==='F'){fitView();drawFloorOverlay();}}
});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();}));
document.addEventListener('drop',e=>{if(!e.dataTransfer?.files?.length)return;e.preventDefault();ADDTO=null;uploadModal([...e.dataTransfer.files]);});
function rerunAnswers(){Object.keys(ANS).forEach(n=>{const old=ANS[n];if(old.kind==='nope'&&old.P?.unsupported)return;const A=answer(old.q,old.scope);A.n=old.n;QN--;ANS[n]=A;const el=document.querySelector(`.ans[data-n="${n}"]`);if(el)el.innerHTML=ansHTML(A);if(ST.active&&ST.active.n===A.n)ST.active=A;});}
const stripPriv=sc=>JSON.parse(JSON.stringify(sc,(k,v)=>k.startsWith('_')?undefined:v));
function exportCSV(){const rows=[['building','floor','sheet','file','status','rooms','apartments','doors','windows','toilets','saunas','net_area_m2','to_check']];
  PROJECT.buildings.forEach(b=>b.sheets.forEach(id=>{const sh=SH[id],st=bStats([sh]);rows.push([b.name,sh.level,sh.code,sh.file,sh.status,st.rooms,st.units,st.doors,st.windows,st.toilets,st.saunas,st.area.toFixed(2),st.flags]);}));
  download(`blueline-takeoff-${new Date().toISOString().slice(0,10)}.csv`,rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(',')).join('\n'),'text/csv');}

/* =====================================================================
   11. Boot: build the sample project and read it
   ===================================================================== */
samplePlans();
Object.values(SH).forEach(putDef);
renderAll();
readAll();
</script>
