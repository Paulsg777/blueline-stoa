<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueline for Stoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
/* VOICE work tool, quiet and technical, like a 3D or CAD viewport
   IDEA a dark model space where the drawing sits on a grid and Blueline traces it in blue
   PICTURE the viewport itself: grey grid, light drawing lines, blue trace, numbered answer marks
   COLOUR greys #1C1C1C to #2E2E2E, ink #E4E4E4, Blueline blue #5B95FF, orange #E8A33D only for checks
   TYPE Inter 13px for UI, JetBrains Mono for figures, Arial on the drawing
   LAYOUT laptop: thin header, viewport with tiny left tool strip, slim right panel, status bar; phone: stacked */
:root{color-scheme:dark;--app:#1C1C1C;--hdr:#262626;--side:#262626;--box:#2F2F2F;--fld:#1F1F1F;--vp:#2D2D2D;--bd:#151515;--bd2:#3A3A3A;--ink:#E4E4E4;--mut:#9A9A9A;--fnt:#707070;--blue:#5B95FF;--blue2:#8DB6FF;--bdg:#3A74E8;--bsel:#2B4677;--org:#E8A33D;--ok:#7CC48A}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
svg[aria-hidden]{width:16px;height:16px;flex:none}
[data-ic]{display:inline-flex}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.app{display:grid;grid-template-rows:34px minmax(0,1fr) 26px;height:100%}
.hdr{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--hdr);border-bottom:1px solid var(--bd)}
.logo{position:relative;font:800 15px/1 Inter,sans-serif;letter-spacing:-.03em;color:#F2F2F2}
.logo i{position:absolute;left:-3px;right:-3px;top:52%;height:1.5px;background:var(--blue);transform-origin:left;animation:slice .8s cubic-bezier(.65,0,.35,1) .15s both}
@keyframes slice{from{transform:scaleX(0)}}
.sep{width:1px;height:14px;background:var(--bd2);flex:none}
.file{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.tag{font-size:12px;color:var(--mut);background:#323232;border-radius:4px;padding:2px 8px;white-space:nowrap}
.hb{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:0;border-radius:5px;background:#3A3A3A;font-size:12.5px;white-space:nowrap}
.hb:hover{background:#474747}
.body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:1px;background:var(--bd);min-height:0}
.vp{position:relative;background-color:var(--vp);overflow:hidden;touch-action:none;min-height:0;cursor:default}
.vp.drag{cursor:grabbing}
.vp.measure{cursor:crosshair}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .35s}
#hl,#ms{pointer-events:none}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .35s;pointer-events:none}
.m3d #c3d{opacity:1;pointer-events:auto}
.m3d #svg{opacity:0}
.m3d .tools,.m3d .nav,.m3d .clr,.m3d .cnt{display:none}
.s-bd{fill:none;stroke:#444;stroke-width:1}
.s-g{stroke:#474747;stroke-width:.8;stroke-dasharray:6 4}
.s-bub{fill:none;stroke:#6A6A6A;stroke-width:1}
.s-bt{fill:#9A9A9A;font:600 11px Arial,sans-serif;text-anchor:middle}
.s-dl{stroke:#666;stroke-width:.8}
.s-dt{fill:#8A8A8A;font:9px Arial,sans-serif;text-anchor:middle}
.s-we{stroke:#D2D2D2;stroke-width:4.5;stroke-linecap:square}
.s-wi{stroke:#D2D2D2;stroke-width:2.6;stroke-linecap:square}
.s-d{fill:none;stroke:#B5B5B5;stroke-width:1}
.s-df{fill:none;stroke:#6E6E6E;stroke-width:.7;stroke-dasharray:2 3}
.s-k{fill:none;stroke:#ACACAC;stroke-width:.9}
.s-rn{fill:#BDBDBD;font:700 10px Arial,sans-serif;text-anchor:middle;letter-spacing:.04em}
.s-rs{fill:#8C8C8C;font:9px Arial,sans-serif;text-anchor:middle}
.s-tt{fill:#C8C8C8;font:700 14px Arial,sans-serif}
.s-ts{fill:#8C8C8C;font:9px Arial,sans-serif}
.s-nt{fill:#3D3D3D}
#src{transition:opacity 2.2s ease-out}
.traced #src{opacity:.32}
.layeroff #src{opacity:1}
.layeroff #ov,.layeroff #hl{display:none}
.tr{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s ease-out}
.tr.on{stroke-dashoffset:0}
.trm{stroke:#5F79AD;stroke-width:1.2}
.rf{fill:transparent;pointer-events:none}
.ready.sel-tool .rf{pointer-events:all;cursor:pointer}
.ready.sel-tool .rf:hover{fill:rgba(91,149,255,.08)}
.rf.sel{fill:rgba(91,149,255,.16);stroke:var(--blue);stroke-width:2.4}
.hn{fill:#fff;text-anchor:middle;font-family:Inter,sans-serif;font-weight:700}
.hg{transition:opacity .15s}
.hg.dim{opacity:.28}
#scan{stroke:var(--blue);stroke-width:2.5}
.ovl{position:absolute;z-index:2}
.vlab{position:absolute;left:56px;top:10px;font-size:12px;color:#C4C4C4;line-height:1.55;pointer-events:none;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.vlab .l3{font:12px 'JetBrains Mono',monospace;color:var(--blue2);transition:opacity .5s}
.tools{left:10px;top:10px;display:flex;flex-direction:column;gap:2px;background:#232323;border:1px solid var(--bd);border-radius:7px;padding:3px}
.tb{width:32px;height:32px;border:0;border-radius:5px;background:none;color:#D0D0D0;display:grid;place-items:center}
.tb:hover{background:#383838}
.tb.on{background:var(--bsel);color:#fff}
.tb[aria-pressed=true]{color:var(--blue2)}
.tb[aria-pressed=false]{color:#777}
.tb svg{width:17px;height:17px}
.tsep{height:1px;background:#3A3A3A;margin:3px 5px}
.nav{right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.nb{width:30px;height:30px;border:0;border-radius:50%;background:rgba(40,40,40,.85);color:#D0D0D0;display:grid;place-items:center}
.nb:hover{background:#444}
.nb svg{width:16px;height:16px}
.drop{inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.dz{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--mut);padding:28px 34px;border:1px dashed #4C4C4C;border-radius:10px;background:rgba(32,32,32,.7);max-width:100%}
.dz>[data-ic] svg{width:24px;height:24px;color:#8A8A8A;margin-bottom:4px}
.dz b{color:var(--ink);font-weight:500;font-size:15px}
.drop.over .dz{border-color:var(--blue);background:rgba(43,70,119,.35)}
.drow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border:0;border-radius:6px;background:#3A3A3A;font-size:13px;white-space:nowrap}
.btn:hover{background:#474747}
.btn.pri{background:var(--bdg);color:#fff}
.btn.pri:hover{background:#4A82F0}
.clr{right:50px;top:10px;height:28px;padding:0 11px;border:0;border-radius:6px;background:rgba(40,40,40,.9);font-size:12.5px;color:#D0D0D0}
.clr:hover{background:#444}
.banner{left:56px;right:56px;bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#262626;border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;color:#CFCFCF}
.banner span{flex:1 1 240px}
.isready .banner{bottom:56px}
.kin{height:30px;flex:1 1 180px;max-width:260px;border:1px solid var(--bd2);border-radius:6px;background:var(--fld);color:var(--ink);font:13px Inter,sans-serif;padding:0 9px}
.upl.traced #src{opacity:.55}
.v3d{right:12px;bottom:12px;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;border:0;border-radius:7px;background:var(--bdg);color:#fff;font-weight:500;font-size:13px;white-space:nowrap}
.v3d:hover{background:#4A82F0}
.v3d.back{background:#3A3A3A;color:var(--ink)}
.v3d.back:hover{background:#474747}
.v3d[disabled]{opacity:.75;cursor:progress}
.v3d svg{width:16px;height:16px}
.cnt{left:12px;bottom:12px;display:flex;align-items:baseline;gap:8px;background:rgba(30,30,30,.9);border:1px solid var(--bd2);border-radius:8px;padding:6px 12px 7px;pointer-events:none}
.cnt b{font:500 26px/1 'JetBrains Mono',monospace;color:var(--blue2)}
.cnt span{color:#C8C8C8;font-size:13px}
.side{background:var(--side);display:flex;flex-direction:column;min-height:0}
.stabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--bd)}
.st{height:26px;padding:0 13px;border:0;border-radius:5px;background:none;color:var(--mut);font-size:13px}
.st[aria-selected=true]{background:#3A3A3A;color:var(--ink)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:14px}
.empty{margin:auto 0}
.empty h2{font-size:15px;font-weight:600;margin:0 0 3px}
.empty p{color:var(--mut);margin:0 0 12px}
.sgl{display:flex;flex-direction:column;gap:4px}
.sg{display:flex;align-items:center;gap:10px;text-align:left;height:36px;padding:0 10px;border:0;border-radius:6px;background:var(--box);font-size:13px}
.sg:hover{background:#3A3A3A}
.sg svg{color:var(--mut)}
.msg.user{align-self:flex-end;max-width:88%;background:#3A3A3A;border-radius:8px;padding:7px 11px}
.msg.bot{color:#D8D8D8}
.think{color:var(--mut);display:flex;align-items:center;gap:8px}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid #444;border-top-color:var(--blue);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
details.how{margin-bottom:5px}
details.how summary{list-style:none;cursor:pointer;color:var(--fnt);font-size:12.5px;display:flex;align-items:center;gap:6px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:'';width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.how[open] summary::before{transform:rotate(45deg)}
details.how ol{margin:5px 0 0;padding-left:18px;color:var(--mut);font-size:12.5px}
.atext b{color:#fff;font-weight:600}
.pill{display:inline-grid;place-items:center;min-width:21px;height:19px;padding:0 5px;border:0;border-radius:4px;background:#3A3A3A;color:#D8D8D8;font:500 12px/1 'JetBrains Mono',monospace;vertical-align:1px;margin:0 1px}
.pill:hover,.pill.on{background:var(--bdg);color:#fff}
.pill.fl{background:rgba(232,163,61,.18);color:var(--org)}
.pill.fl:hover,.pill.fl.on{background:var(--org);color:#1A1A1A}
.pgrid{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.msg h4{font-size:12.5px;font-weight:600;color:var(--mut);margin:11px 0 3px}
.rows{margin:0;padding-left:16px}
.rows li{margin:2px 0}
.calc{font:12px 'JetBrains Mono',monospace;color:var(--mut)}
.ok{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);margin-top:7px}
.ok svg{width:14px;height:14px}
.flag{font-size:12.5px;color:#F0B867;background:rgba(232,163,61,.1);border-radius:6px;padding:6px 9px;margin:9px 0 0}
.meta{font-size:12px;color:var(--fnt);margin-top:8px;display:flex;align-items:center;gap:6px}
.sgrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sgrow button{height:26px;padding:0 9px;border:0;border-radius:5px;background:var(--box);font-size:12.5px;color:#D0D0D0}
.sgrow button:hover{background:#3A3A3A}
.composer{margin:0 10px;border:1px solid var(--bd2);border-radius:8px;background:var(--fld);padding:8px 8px 6px 10px}
.scope{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--bsel);color:#DCE6FF;border-radius:4px;padding:2px 3px 2px 8px;margin-bottom:5px}
.scope button{border:0;background:none;width:18px;height:18px;border-radius:3px;color:#DCE6FF;line-height:1}
.composer textarea{width:100%;border:0;resize:none;font:15px/1.4 Inter,sans-serif;color:var(--ink);background:none;outline:none;max-height:110px}
.composer textarea::placeholder{color:#6E6E6E}
.crow{display:flex;align-items:center;gap:6px;margin-top:2px}
.cbtn{width:28px;height:28px;border-radius:50%;border:0;background:#333;color:#BDBDBD;display:grid;place-items:center}
.send{margin-left:auto;width:30px;height:30px;border-radius:50%;border:0;background:#444;color:#AAA;display:grid;place-items:center}
.send.live{background:var(--bdg);color:#fff}
.disc{font-size:12px;color:var(--fnt);text-align:center;margin:6px 10px 9px}
.ipane{flex:1;min-height:0;overflow-y:auto;padding:6px 0 12px}
.hint{color:var(--mut);margin:10px 14px}
details.ps{border-bottom:1px solid #2F2F2F}
details.ps>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 12px;font-weight:600;font-size:13px}
details.ps>summary::-webkit-details-marker{display:none}
details.ps>summary::before{content:'';width:5px;height:5px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(-45deg);transition:transform .15s}
details.ps[open]>summary::before{transform:rotate(45deg)}
details.ps>summary .c{margin-left:auto;color:var(--fnt);font-weight:400}
.pb{padding:0 12px 10px}
.prow{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;margin:3px 0}
.prow label{color:var(--mut);text-align:right;font-size:12.5px}
.fld{background:var(--box);border-radius:4px;padding:4px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld.n{font:13px 'JetBrains Mono',monospace}
.fld.hi{background:var(--bsel);color:#fff}
.pnote{font:12px 'JetBrains Mono',monospace;color:var(--mut);margin:7px 0 0 104px}
.pchk{display:flex;align-items:center;gap:8px;margin:2px 0 10px 104px;cursor:pointer}
.pchk input{accent-color:var(--blue);width:15px;height:15px;margin:0}
.pbtn{width:100%;height:30px;border:0;border-radius:6px;background:#3A3A3A;font-size:13px}
.pbtn:hover{background:#474747}
.ol{display:flex;flex-direction:column}
.orow{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 12px 4px 26px;text-align:left;font-size:13px;color:#D0D0D0}
.orow:hover{background:#2E2E2E}
.orow.on{background:var(--bsel);color:#fff}
.orow i{width:9px;height:9px;border:1.5px solid #8A8A8A;border-radius:2px;flex:none}
.orow.on i{border-color:#fff}
.orow .num{margin-left:auto;font:12px 'JetBrains Mono',monospace;color:var(--mut);white-space:nowrap}
.orow.on .num{color:#DCE6FF}
.status{display:flex;align-items:center;gap:10px;padding:0 10px;background:#202020;border-top:1px solid var(--bd);font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden}
.status .k{color:#C8C8C8}
.status .m{font-family:'JetBrains Mono',monospace;color:#BDBDBD}
@media (prefers-reduced-motion:reduce){.logo i{animation:none}.tr{transition:none}#src{transition:none}.spin{animation:none}#svg,#c3d{transition:none}}
@media (max-width:900px){
  html,body{height:auto;overflow:auto}
  .app{height:auto;grid-template-rows:auto auto auto}
  .hdr{height:40px}
  .body{grid-template-columns:1fr}
  .vp{height:min(62vh,600px);min-height:360px}
  .side{height:600px}
  .status{height:26px}
}
@media (max-width:520px){.tag,.status .h{display:none}.vlab{display:none}.banner{left:12px;right:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <span class="logo">Blueline<i></i></span>
    <span class="sep"></span>
    <span class="file" id="fname">No drawing open</span>
    <span class="sp"></span>
    <span class="tag" id="demo" hidden>Demo · sample data</span>
    <span class="tag" id="byc" hidden title="The Blueline model is not connected yet; Claude reads uploads in this demo">Read by Claude</span>
    <button class="hb" id="hsamp" hidden>Sample</button>
    <button class="hb" id="up" aria-label="Upload a drawing"><span data-ic="upload"></span>Upload</button>
    <input type="file" id="file" accept="image/png,image/jpeg" class="sr" tabindex="-1">
  </header>
  <div class="body">
    <section class="vp" id="cv" aria-label="Drawing viewport">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Construction drawing with Blueline trace">
        <g id="sheet" style="display:none"><g id="src"></g><g id="ov"></g><g id="rfs"></g><g id="hl"></g><g id="ms"></g><line id="scan" x1="0" x2="1400" y1="-10" y2="-10" style="display:none"/></g>
        <g id="imgg"></g>
      </svg>
      <canvas id="c3d" hidden aria-label="3D view of the traced floor"></canvas>
      <div class="vlab" id="vlab"><div id="vl1">Plan view</div><div id="vl2">No drawing</div><div class="l3" id="vl3"></div></div>
      <div class="tools ovl" role="toolbar" aria-label="Tools">
        <button class="tb on" data-tool="select" aria-label="Select tool (S)" title="Select (S)"><span data-ic="cursor"></span></button>
        <button class="tb" data-tool="measure" aria-label="Measure tool (M)" title="Measure (M)"><span data-ic="ruler"></span></button>
        <div class="tsep"></div>
        <button class="tb" id="layer" aria-pressed="true" aria-label="Blueline layer (L)" title="Blueline layer (L)"><span data-ic="layers"></span></button>
      </div>
      <div class="nav ovl">
        <button class="nb" id="zi" aria-label="Zoom in" title="Zoom in"><span data-ic="plus"></span></button>
        <button class="nb" id="zo" aria-label="Zoom out" title="Zoom out"><span data-ic="minus"></span></button>
        <button class="nb" id="fitb" aria-label="Frame drawing (F)" title="Frame drawing (F)"><span data-ic="fit"></span></button>
      </div>
      <button class="clr ovl" id="hlc" hidden>Clear marks</button>
      <div class="cnt ovl" id="cnt" hidden aria-live="polite"><b id="cntn">0</b><span id="cntl"></span></div>
      <button class="v3d ovl" id="b3d" hidden><span data-ic="cube" id="b3di"></span><span id="b3dl">View in 3D</span></button>
      <div class="drop ovl" id="drop">
        <div class="dz">
          <span data-ic="upload"></span>
          <b>Drop a drawing</b>
          <span>PNG or JPG</span>
          <div class="drow"><button class="btn" id="choose">Choose file</button><button class="btn pri" id="samp">Open sample A-201</button></div>
        </div>
      </div>
      <div class="banner ovl" id="ban" hidden><span id="bantext"></span><input id="key" class="kin" type="password" placeholder="Anthropic API key" autocomplete="off" spellcheck="false" aria-label="Anthropic API key" hidden><button class="btn pri" id="bankey" hidden>Trace</button><button class="btn" id="banstop" hidden>Stop</button><button class="btn pri" id="banretry" hidden>Try again</button><button class="btn" id="bansamp">Open sample</button></div>
    </section>
    <aside class="side" aria-label="Ask and inspect">
      <div class="stabs" role="tablist">
        <button class="st" role="tab" id="tAsk" aria-selected="true">Ask</button>
        <button class="st" role="tab" id="tIns" aria-selected="false">Inspect</button>
      </div>
      <div class="pane" id="pAsk">
        <div class="msgs" id="msgs"></div>
        <form class="composer" id="comp">
          <div class="scope" id="scope" hidden></div>
          <label for="q" class="sr">Question</label>
          <textarea id="q" rows="1" placeholder="Ask anything about this drawing"></textarea>
          <div class="crow"><button type="button" class="cbtn" id="att" aria-label="Upload a drawing"><span data-ic="plus"></span></button><button type="submit" class="send" id="send" aria-label="Send"><span data-ic="up"></span></button></div>
        </form>
        <p class="disc">Answers come from the traced drawing. Check the marked items.</p>
      </div>
      <div class="pane" id="pIns" hidden><div class="ipane" id="ins"></div></div>
    </aside>
  </div>
  <footer class="status"><span id="hint" class="h">Drop a drawing or open the sample</span><span class="sp"></span><span id="stat" class="m"></span></footer>
</div>
<script>
{
const $=s=>document.querySelector(s);

const polyD=p=>`M${p.map(q=>q.join(' ')).join('L')}Z`;

const READ_PROMPT=(W,H)=>`You are tracing an architectural floor plan so that every later answer can be checked on the drawing.
The image is ${W} x ${H} pixels. Give coordinates as integer pixels of THIS image: x from the left edge (0 to ${W}), y from the top edge (0 to ${H}).

Reply with JSON Lines only: one JSON object per line, no other text and no code fences, in this order.
First line:
{"t":"meta","title":"short title of the drawing","kind":"floor plan" or "other","scale":"printed scale such as 1:100, or null","bar":{"p":[x1,y1,x2,y2],"m":metres} or null,"dim":{"p":[x1,y1,x2,y2],"m":metres} or null}
  bar = the two ends of a graphic scale bar and the length in metres it shows. dim = the two ends of one clearly printed dimension and its length in metres.
Then one line per room or space:
{"t":"room","id":"R1","name":"room label as printed","type":"bedroom|living|kitchen|dining|bathroom|wc|sauna|hall|corridor|closet|storage|utility|balcony|office|meeting|stair|technical|other","area":printed area in m2 as a number or null,"poly":[[x,y],...]}

function otsu(l){const h=new Array(256).fill(0);for(let i=0;i<l.length;i++)h[l[i]]++;let sum=0;for(let i=0;i<256;i++)sum+=i*h[i];let sB=0,wB=0,best=0,thr=128;

/* the image Claude sees: at most about 1.1 megapixels, so its pixel coordinates match ours; plus a mask of thick lines (walls) */
async function prepImage(f){const url=URL.createObjectURL(f);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=url;});
  const nw=img.naturalWidth,nh=img.naturalHeight,k=Math.min(1,Math.sqrt(1.1e6/(nw*nh)),1568/Math.max(nw,nh)),W=Math.max(1,Math.round(nw*k)),H=Math.max(1,Math.round(nh*k));

  const px=g.getImageData(0,0,W,H).data,lum=new Uint8Array(W*H);for(let i=0;i<W*H;i++)lum[i]=(px[i*4]*299+px[i*4+1]*587+px[i*4+2]*114)/1000;
  const t=Math.min(otsu(lum),200),dark=new Uint8Array(W*H);for(let i=0;i<W*H;i++)dark[i]=lum[i]<t?1:0;

/* snap each straight edge to the nearest inside face of a wall: dark on the wall side, light on the room side */
function snapPoly(poly,P){const{W,H,thick}=P,R=Math.max(5,Math.round(Math.max(W,H)*.018));

  const fr=(hz,v,a,b)=>{if(v<0||v>=(hz?H:W))return 0;let s=0,m=0;const lo=Math.max(0,Math.round(a)),hi=Math.min((hz?W:H)-1,Math.round(b));for(let u=lo;u<=hi;u++){s+=hz?thick[v*W+u]:thick[u*W+v];m++;}return m?s/m:0;};

    const v0=Math.round(hz?(a[1]+b[1])/2:(a[0]+b[0])/2),lo=Math.min(hz?a[0]:a[1],hz?b[0]:b[1]),hi=Math.max(hz?a[0]:a[1],hz?b[0]:b[1]),m=(hi-lo)*.15,s=(hz?c[1]:c[0])>v0?1:-1;

const TYPEMAP={bedroom:'Bedroom',living:'Living',kitchen:'Kitchen',dining:'Dining',bathroom:'Bathroom',wc:'WC',sauna:'Sauna',hall:'Hall',corridor:'Corridor',closet:'Closet',storage:'Storage',utility:'Utility',balcony:'Balcony',office:'Office',meeting:'Meeting',stair:'Stair',technical:'Technical',other:'Room'};

  return rects.filter(r=>{const cx=(r[0]+r[2])/2,cy=(r[1]+r[3])/2;if(cx<a-tol*2||cx>c+tol*2||cy<b-tol*2||cy>d+tol*2)return false;const p=[cx,cy];return rooms.some(rm=>edgeD(p,rm.poly)<=tol+Math.min(r[2]-r[0],r[3]-r[1])/2);});}
function pick3D(e){const r=c3.getBoundingClientRect();T3.ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);T3.ray.setFromCamera(T3.ndc,T3.cam);const hit=T3.ray.intersectObjects(T3.slabs,false)[0];return hit?hit.object.userData.id:null;}
function paintSlabs(h){if(!T3.slabs)return;T3.slabs.forEach(m=>{const id=m.userData.id,r=byId(id);if(id===st.sel)m.material.color.copy(T3.cSel);else m.material.color.copy(T3.cBg).lerp(r&&(r.type==='Corridor'||r.type==='Hall')?T3.cCorr:T3.cRoom,h);});}
function size3D(){if(!T3.R)return;const[cw,ch]=csz();T3.R.setSize(cw,ch,false);T3.cam.aspect=cw/ch;T3.cam.updateProjectionMatrix();}
/* camera poses: plan = straight down, lined up with the 2D view; quarter = 3/4 view framing the floor */
function planPose(){const[cw,ch]=csz(),ppm=S*cw/view.w,sx=view.x+view.w/2,sy=view.y+view.h/2;return{t:[(sx-OX)/S-PCX,0,(sy-OY)/S-PCY],r:ch/(2*Math.tan(FOV*Math.PI/360)*ppm),phi:.0008,th:0};}
function quarterPose(){const[cw,ch]=csz(),tv=Math.tan(FOV*Math.PI/360),phi=.92,th=-.5,c=Math.cos(th),s=Math.abs(Math.sin(th)),hw=(BW*c+BD*s)*.6,hv=((BW*s+BD*c)*Math.cos(phi)+WH*Math.sin(phi))*.66;return{t:[0,.6,0],r:Math.max(hw/(tv*cw/ch),hv/tv),phi,th};}
function curPose(){const c=T3.cam.position,t=T3.ctl.target,dx=c.x-t.x,dy=c.y-t.y,dz=c.z-t.z,r=Math.hypot(dx,dy,dz);return{t:[t.x,t.y,t.z],r,phi:Math.acos(Math.max(-1,Math.min(1,dy/r))),th:Math.atan2(dx,dz)};}
function setCam({t,r,phi,th}){const s=Math.sin(phi);T3.cam.position.set(t[0]+r*s*Math.sin(th),t[1]+r*Math.cos(phi),t[2]+r*s*Math.cos(th));T3.ctl.target.set(t[0],t[1],t[2]);T3.cam.lookAt(T3.ctl.target);}
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function tween(a,b,ms,h0,h1,done){T3.anim={a,b,ms:RM?1:ms,h0,h1,done,t0:performance.now()};}
function step3D(){const A=T3.anim,p=Math.min(1,(performance.now()-A.t0)/A.ms),e=ease(p),L=(x,y)=>x+(y-x)*e;
  setCam({t:A.a.t.map((v,i)=>L(v,A.b.t[i])),r:L(A.a.r,A.b.r),phi:L(A.a.phi,A.b.phi),th:L(A.a.th,A.b.th)});
  T3.h=L(A.h0,A.h1);T3.wg.scale.y=Math.max(.002,T3.h);T3.em.opacity=.9-.55*T3.h;paintSlabs(T3.h);
  if(p>=1){T3.anim=null;if(A.done)A.done();}}
function loop3D(){if(!T3.on)return;T3.raf=requestAnimationFrame(loop3D);if(T3.anim)step3D();else T3.ctl.update();
  const r=T3.cam.position.distanceTo(T3.ctl.target);T3.sc.fog.near=r*1.4;T3.sc.fog.far=r*3.6;T3.R.render(T3.sc,T3.cam);}
function setB3(is3d){b3.classList.toggle('back',is3d);$('#b3di').innerHTML=ic(is3d?'plan':'cube');$('#b3dl').textContent=is3d?'Back to plan':'View in 3D';}
async function enter3D(){if(st.phase!=='ready'||st.mode3d||T3.busy)return;T3.busy=true;b3.disabled=true;$('#b3dl').textContent='Loading 3D…';
  try{const lib=await load3D();if(!T3.R)build3D(lib);if(T3.doc!==st.docId)model3D();}
  catch(err){T3.busy=false;b3.disabled=false;setB3(false);$('#hint').textContent='The 3D view needs an internet connection and WebGL.';return;}
  b3.disabled=false;if(st.phase!=='ready'){T3.busy=false;setB3(false);return;}
  st.mode3d=true;st.meas=null;st.snap=null;drawMeasure();c3.hidden=false;size3D();
  const p0=planPose();setCam(p0);T3.h=0;T3.wg.scale.y=.002;T3.em.opacity=.9;paintSlabs(0);T3.ctl.enabled=false;
  T3.on=true;cancelAnimationFrame(T3.raf);loop3D();void c3.offsetWidth;cv.classList.add('m3d');setB3(true);setLabel();setStatus();
  tween(p0,quarterPose(),2000,0,1,()=>{T3.ctl.enabled=true;T3.busy=false;});}
function exit3D(done){if(!st.mode3d){if(done)done();return;}if(T3.busy){if(done)setTimeout(()=>exit3D(done),150);return;}
  T3.busy=true;T3.ctl.enabled=false;
  tween(curPose(),planPose(),1000,T3.h,0,()=>{st.mode3d=false;cv.classList.remove('m3d');setB3(false);setLabel();setStatus();
    setTimeout(()=>{if(!st.mode3d){T3.on=false;cancelAnimationFrame(T3.raf);c3.hidden=true;}T3.busy=false;},380);if(done)done();});}
function leave3DNow(){if(!T3.R)return;T3.anim=null;T3.on=false;cancelAnimationFrame(T3.raf);T3.busy=false;T3.ctl.enabled=false;st.mode3d=false;cv.classList.remove('m3d');c3.hidden=true;setB3(false);}
b3.onclick=()=>{if(st.mode3d)exit3D();else enter3D();};

renderEmpty();renderInspect();setLabel();syncTool();applyView();
window.__blueline={startRead,openSample,ask,selectRoom,tabTo,st,T3,enter3D,exit3D,setTool:t=>{st.tool=t;syncTool();},
  rooms:()=>rooms.map(r=>({id:r.id,name:r.name,label:r.label,type:r.type,area:r.area,geo:r.geo,printed:r.printed,poly:r.poly})),
  dump:()=>({rooms:rooms.map(r=>[r.name,r.label,r.type,r.area,r.geo&&+r.geo.toFixed(2)]),doors:doors.map(d=>d.label),wins:wins.map(w=>byId(w.room)?byId(w.room).name:null),fix:fix.map(f=>[f.kind,byId(f.room)?byId(f.room).name:null]),pxPerM:+S.toFixed(2),sheet:[SW,SH]})};
}
